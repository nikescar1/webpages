<!doctype html>
<!--
  Gridiron — fantasy football league (self-contained)

  Player data: nflverse open data (github.com/nflverse) — 312 players,
  ranked by 2025 per-game production above positional replacement.

  Runs standalone against CPU managers with no server. To play a shared league
  with live NFL scoring, deploy fantasy-football/worker (Cloudflare Workers +
  Durable Objects) and paste its URL into the "Shared league" tab.

  Generated by fantasy-football/build.mjs — edit files in fantasy-football/src
  and re-run `node fantasy-football/build.mjs`, not this file.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Gridiron — a self-contained fantasy football league: live snake draft, real NFL production data, weekly matchups and a 3D trophy ceremony.">
<title>Gridiron · Fantasy Football</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">

<!-- ===== styles ===== -->
<style>/* ============================================================ Gridiron
   Design tokens
   ============================================================ */
:root {
  --bg: #05080f;
  --bg-2: #0a1020;
  --surface: rgba(255, 255, 255, .035);
  --surface-2: rgba(255, 255, 255, .06);
  --surface-3: rgba(255, 255, 255, .10);
  --line: rgba(255, 255, 255, .09);
  --line-2: rgba(255, 255, 255, .16);

  --text: #eef2fb;
  --muted: #94a1bd;
  --dim: #5f6d8c;

  --mint: #00e5a0;
  --hot: #ff2d6f;
  --gold: #ffc531;
  --blue: #4cc9f0;
  --violet: #b892ff;

  --qb: #ff5c8a;
  --rb: #00e5a0;
  --wr: #4cc9f0;
  --te: #ffb703;
  --k: #b892ff;
  --dst: #8aa0c9;

  --r-sm: 8px;
  --r: 13px;
  --r-lg: 20px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --rail: 76px;
  --top: 58px;

  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  --font: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  font-size: 14px;
}

/* Ambient field glow behind everything. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(0, 229, 160, .10), transparent 60%),
    radial-gradient(900px 600px at 92% 8%, rgba(76, 201, 240, .09), transparent 62%),
    radial-gradient(800px 800px at 50% 115%, rgba(255, 45, 111, .07), transparent 60%),
    var(--bg-2);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); background-clip: content-box; }

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ============================================================ Primitives */

button, input, select, textarea { font: inherit; color: inherit; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px;
  transition: background .16s var(--ease), transform .16s var(--ease), border-color .16s;
  white-space: nowrap; user-select: none;
}
.btn:hover:not(:disabled) { background: var(--surface-3); border-color: var(--line-2); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--mint), #00b894);
  color: #04231a; border-color: transparent;
  box-shadow: 0 6px 22px rgba(0, 229, 160, .28);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: linear-gradient(135deg, var(--mint), #00b894); }

.btn-hot { background: linear-gradient(135deg, var(--hot), #d61f5b); color: #fff; border-color: transparent; box-shadow: 0 6px 22px rgba(255,45,111,.3); }
.btn-hot:hover:not(:disabled) { filter: brightness(1.08); background: linear-gradient(135deg, var(--hot), #d61f5b); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 7px; }
.btn-lg { padding: 14px 24px; font-size: 15px; border-radius: 11px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }

input[type=text], input[type=email], input[type=password], input[type=number], select, textarea {
  background: rgba(0, 0, 0, .3); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 13px; outline: none; width: 100%;
  transition: border-color .16s, box-shadow .16s; font-size: 14px;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--mint); box-shadow: 0 0 0 3px rgba(0, 229, 160, .14);
}
input::placeholder { color: var(--dim); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 16px center, right 11px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
select option { background: #101828; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); backdrop-filter: blur(12px);
}

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--line); cursor: pointer;
  transition: all .15s var(--ease); user-select: none; white-space: nowrap;
}
.chip:hover { background: var(--surface-3); }
.chip.on { background: var(--text); color: #06101c; border-color: transparent; }

.pos {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; padding: 3px 7px; border-radius: 6px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .05em;
  background: var(--surface-3); color: var(--muted);
}
.pos.QB { background: rgba(255,92,138,.16); color: var(--qb); }
.pos.RB { background: rgba(0,229,160,.15); color: var(--rb); }
.pos.WR { background: rgba(76,201,240,.15); color: var(--wr); }
.pos.TE { background: rgba(255,183,3,.15); color: var(--te); }
.pos.K  { background: rgba(184,146,255,.15); color: var(--k); }
.pos.DST{ background: rgba(138,160,201,.15); color: var(--dst); }

.muted { color: var(--muted); }
.dim { color: var(--dim); }
.tiny { font-size: 11px; }
.mono-lg { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }

.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.15); border-top-color: var(--mint);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================ Shell */

#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

.topbar {
  height: var(--top); flex: 0 0 auto;
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(5, 8, 15, .72); backdrop-filter: blur(16px);
  z-index: 40;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.02em; font-size: 15px; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--mint), var(--blue)); color: #04231a; font-size: 14px;
  box-shadow: 0 3px 14px rgba(0,229,160,.35);
}
.topbar-spacer { flex: 1; }

.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 0 rgba(255,45,111,.6); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(255,45,111,0); } 100% { box-shadow: 0 0 0 0 rgba(255,45,111,0); } }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
.badge.live { background: rgba(255,45,111,.12); border-color: rgba(255,45,111,.3); color: #ff9ebc; }
.badge.cloud { background: rgba(76,201,240,.12); border-color: rgba(76,201,240,.3); color: #9adcf5; }
.badge.local { background: rgba(255,197,49,.1); border-color: rgba(255,197,49,.26); color: #ffd97a; }

.shell { flex: 1; display: flex; min-height: 0; }

.rail {
  width: var(--rail); flex: 0 0 auto; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0;
  background: rgba(5, 8, 15, .5);
}
.rail-btn {
  width: 56px; padding: 9px 0; border-radius: 11px; border: none; background: transparent;
  color: var(--dim); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .03em; transition: all .16s var(--ease);
}
.rail-btn svg { width: 20px; height: 20px; }
.rail-btn:hover { color: var(--text); background: var(--surface); }
.rail-btn.on { color: var(--mint); background: rgba(0,229,160,.10); }
.rail-btn .dot { position: absolute; }

.main { flex: 1; min-width: 0; overflow: auto; position: relative; }
.page { padding: 20px; max-width: 1500px; margin: 0 auto; }

.page-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; font-weight: 800; }
.page-head .sub { color: var(--muted); font-size: 13px; }

/* ============================================================ Gate / auth */

.gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: auto; }
/* A canvas is a replaced element: inset:0 alone leaves it at its intrinsic
   300x150, so both canvases need explicit width/height. */
#gate-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
.gate-inner { width: min(430px, calc(100vw - 32px)); padding: 32px 0; }
.gate-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.gate-logo .brand-mark { width: 40px; height: 40px; border-radius: 11px; font-size: 21px; }
.gate h1 { font-size: 34px; margin: 12px 0 6px; letter-spacing: -.035em; font-weight: 850; line-height: 1.06; }
.gate p.lede { color: var(--muted); margin: 0 0 24px; line-height: 1.55; font-size: 14px; }
.gate-card { padding: 22px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,.35); border-radius: 10px; margin-bottom: 18px; }
.tabs button { flex: 1; padding: 9px; border: none; background: transparent; color: var(--muted); border-radius: 7px; cursor: pointer; font-weight: 700; font-size: 13px; transition: all .16s var(--ease); }
.tabs button.on { background: var(--surface-3); color: var(--text); }
.stack { display: flex; flex-direction: column; gap: 13px; }
.err-msg { color: #ff9ebc; font-size: 12.5px; background: rgba(255,45,111,.1); border: 1px solid rgba(255,45,111,.25); padding: 9px 12px; border-radius: 8px; }
.ok-msg { color: #7ff0cb; font-size: 12.5px; background: rgba(0,229,160,.1); border: 1px solid rgba(0,229,160,.25); padding: 9px 12px; border-radius: 8px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 11px; margin: 4px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ============================================================ Hub */

.league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.league-card { padding: 18px; cursor: pointer; transition: all .18s var(--ease); position: relative; overflow: hidden; }
.league-card:hover { transform: translateY(-2px); border-color: var(--line-2); box-shadow: var(--shadow); }
.league-card h3 { margin: 0 0 4px; font-size: 17px; letter-spacing: -.02em; }
.league-card .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .14em; color: var(--mint); font-size: 12px; font-weight: 700; }
.league-card.new { border-style: dashed; display: grid; place-items: center; min-height: 128px; color: var(--muted); }
.league-card.new:hover { color: var(--mint); border-color: var(--mint); }

/* ============================================================ Draft room */

.draft-layout { display: grid; grid-template-columns: 1fr 340px; gap: 14px; height: 100%; }
@media (max-width: 1180px) { .draft-layout { grid-template-columns: 1fr; } }

.clock-bar {
  display: flex; align-items: center; gap: 16px; padding: 13px 18px; margin-bottom: 14px;
  border-radius: var(--r); border: 1px solid var(--line);
  background: linear-gradient(100deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  position: relative; overflow: hidden;
}
.clock-bar::before {
  content: ''; position: absolute; inset: 0; opacity: .16; pointer-events: none;
  background: linear-gradient(100deg, var(--team-color, var(--mint)), transparent 62%);
}
.clock-bar.urgent { animation: urgent 1s ease-in-out infinite; }
@keyframes urgent { 50% { border-color: rgba(255,45,111,.55); box-shadow: 0 0 26px rgba(255,45,111,.18); } }

.clock-ring { position: relative; width: 60px; height: 60px; flex: 0 0 auto; }
.clock-ring svg { transform: rotate(-90deg); }
.clock-ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.02em; }

.onclock-label { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.onclock-team { font-size: 20px; font-weight: 800; letter-spacing: -.025em; margin-top: 1px; }

.board-wrap { overflow: auto; border-radius: var(--r); border: 1px solid var(--line); background: rgba(0,0,0,.22); }
.board { border-collapse: separate; border-spacing: 3px; padding: 3px; min-width: 100%; }
.board th {
  position: sticky; top: 0; z-index: 2; background: #0b1120;
  font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: var(--muted);
  padding: 7px 6px; text-align: center; border-radius: 6px; white-space: nowrap;
  max-width: 116px; overflow: hidden; text-overflow: ellipsis;
}
.board td { padding: 0; }
.board .rd { position: sticky; left: 0; z-index: 1; background: #0b1120; color: var(--dim); font-size: 10px; font-weight: 800; text-align: center; padding: 0 7px; border-radius: 6px; }
.cell {
  width: 116px; height: 46px; border-radius: 7px; padding: 5px 7px;
  background: rgba(255,255,255,.03); border: 1px solid transparent;
  display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden;
}
.cell.filled { background: var(--c, rgba(255,255,255,.06)); border-color: rgba(255,255,255,.09); }
.cell .nm { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .mt { font-size: 9.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.cell.oncl { border-color: var(--mint); background: rgba(0,229,160,.1); animation: onclockPulse 1.6s ease-in-out infinite; }
@keyframes onclockPulse { 50% { box-shadow: 0 0 0 3px rgba(0,229,160,.14); } }
.cell.just { animation: pickPop .5s var(--ease); }
@keyframes pickPop { 0% { transform: scale(.86); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }

.pool-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-wrap input { padding-left: 34px; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--dim); pointer-events: none; }

.player-list { display: flex; flex-direction: column; gap: 4px; }
.prow {
  display: grid; grid-template-columns: 30px 38px 1fr auto auto; gap: 10px; align-items: center;
  padding: 7px 10px; border-radius: 9px; background: var(--surface);
  border: 1px solid transparent; cursor: pointer; transition: all .14s var(--ease);
}
.prow:hover { background: var(--surface-2); border-color: var(--line); }
.prow.gone { opacity: .3; }
.prow .rank { font-size: 11px; font-weight: 800; color: var(--dim); text-align: center; }
.avatar {
  width: 38px; height: 38px; border-radius: 9px; object-fit: cover; object-position: top center;
  background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--muted); flex: 0 0 auto;
}
.prow .nm { font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; }
.prow .mt { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 7px; margin-top: 1px; }
.prow .val { text-align: right; }
.prow .val b { font-size: 14px; letter-spacing: -.02em; }
.prow .val span { display: block; font-size: 10px; color: var(--dim); }

.side-panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.panel { padding: 14px; display: flex; flex-direction: column; min-height: 0; }
.panel h3 { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.slot-row { display: grid; grid-template-columns: 42px 1fr auto; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 8px; transition: background .14s; }
.slot-row:hover { background: var(--surface); }
.slot-row.empty { opacity: .45; }
.slot-tag { font-size: 10px; font-weight: 800; color: var(--dim); text-align: center; padding: 3px 0; background: rgba(255,255,255,.05); border-radius: 5px; }
.slot-row .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-row .sub { font-size: 10px; color: var(--dim); }

.ticker { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.tick { font-size: 12px; padding: 7px 9px; border-radius: 8px; background: var(--surface); border-left: 2px solid var(--c, var(--mint)); animation: slideIn .3s var(--ease); }
@keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } }
.tick b { font-weight: 700; }

.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; margin-bottom: 9px; min-height: 90px; }
.msg { font-size: 12.5px; line-height: 1.4; }
.msg .who { font-weight: 700; font-size: 11px; }

/* ============================================================ Roster / matchup */

.roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .roster-grid { grid-template-columns: 1fr; } }

.lineup-row {
  display: grid; grid-template-columns: 46px 40px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--surface); margin-bottom: 4px;
  border: 1px solid transparent; transition: all .15s var(--ease);
}
.lineup-row.drop-ok { border-color: var(--mint); background: rgba(0,229,160,.08); }
.lineup-row.dragging { opacity: .35; }
.lineup-row[draggable=true] { cursor: grab; }
.lineup-row .pts { font-weight: 800; font-size: 15px; letter-spacing: -.02em; }

.vs-grid { display: grid; grid-template-columns: 1fr 66px 1fr; gap: 10px; align-items: center; }
@media (max-width: 780px) { .vs-grid { grid-template-columns: 1fr; } }
.score-big { font-size: 42px; font-weight: 850; letter-spacing: -.045em; line-height: 1; }
.winbar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; display: flex; }
.winbar i { display: block; height: 100%; transition: width .6s var(--ease); }

.mrow { display: grid; grid-template-columns: 1fr 54px 1fr; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: none; }
.mrow .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mrow .side.right { flex-direction: row-reverse; text-align: right; }
.mrow .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .p { font-weight: 800; font-size: 13px; }
.mrow .slot { text-align: center; font-size: 10px; font-weight: 800; color: var(--dim); }

/* ============================================================ Standings */

table.std { width: 100%; border-collapse: collapse; }
table.std th { text-align: left; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); padding: 9px 10px; border-bottom: 1px solid var(--line); font-weight: 800; }
table.std td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
table.std tr:last-child td { border-bottom: none; }
table.std tr:hover td { background: var(--surface); }
table.std .tm { display: flex; align-items: center; gap: 9px; font-weight: 700; }
.swatch { width: 9px; height: 22px; border-radius: 3px; flex: 0 0 auto; }

/* ============================================================ Ceremony */

#ceremony { position: fixed; inset: 0; z-index: 200; display: none; background: #03060c; }
#ceremony.on { display: block; }
#ceremony canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cer-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 7vh; pointer-events: none; text-align: center; }
/* Scrim so the winner's name stays readable over the podium and confetti. */
.cer-ui::before {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(to top, rgba(3,6,12,.92) 12%, rgba(3,6,12,.62) 45%, transparent);
  pointer-events: none;
}
.cer-ui > * { position: relative; }
.cer-kicker { font-size: 12px; font-weight: 800; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); opacity: 0; animation: cerIn .8s var(--ease) .5s forwards; }
.cer-name { font-size: clamp(30px, 7vw, 62px); font-weight: 850; letter-spacing: -.04em; margin: 8px 0 4px; opacity: 0; animation: cerIn .9s var(--ease) .8s forwards; text-shadow: 0 6px 40px rgba(255,197,49,.35); }
.cer-score { font-size: clamp(15px, 2.4vw, 20px); color: var(--muted); opacity: 0; animation: cerIn .9s var(--ease) 1.1s forwards; }
.cer-close { margin-top: 26px; pointer-events: auto; opacity: 0; animation: cerIn .7s var(--ease) 1.8s forwards; }
@keyframes cerIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ============================================================ Modal / toast */

.modal-back { position: fixed; inset: 0; z-index: 150; background: rgba(3,6,12,.76); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; animation: fade .2s; overflow: auto; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(520px, 100%); padding: 24px; background: #0c1322; border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow); animation: modalIn .28s var(--ease); }
@keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }
.modal h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.025em; }
.modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
.modal-actions { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }

#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 11px 18px; border-radius: 11px; background: #131c2e; border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; animation: toastIn .3s var(--ease); max-width: 90vw; }
.toast.good { border-color: rgba(0,229,160,.4); }
.toast.bad { border-color: rgba(255,45,111,.4); }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } }

/* ============================================================ Mobile */

.mobile-tabs { display: none; }
@media (max-width: 760px) {
  .rail { display: none; }
  .page { padding: 14px; }
  .mobile-tabs {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(8,12,22,.94); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-tabs .rail-btn { flex: 1; width: auto; }
  .main { padding-bottom: 64px; }
  .draft-layout { grid-template-columns: 1fr; }
  .page-head h1 { font-size: 21px; }
}
</style>

<!-- ===== auth / landing ===== -->
<div id="gate" class="gate"></div>

<!-- ===== app shell ===== -->
<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">🏈</div><span>Gridiron</span></div>
    <div style="width:1px;height:26px;background:var(--line)"></div>
    <div id="topbar-league"></div>
    <div class="topbar-spacer"></div>
    <div id="topbar-status" style="display:flex;gap:8px;align-items:center"></div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>
  </div>

  <nav class="mobile-tabs" id="mobile-tabs"></nav>
</div>

<!-- ===== winner ceremony ===== -->
<div id="ceremony">
  <canvas id="cer-canvas"></canvas>
  <div class="cer-ui">
    <div class="cer-kicker" id="cer-kicker"></div>
    <div class="cer-name" id="cer-name"></div>
    <div class="cer-score" id="cer-score"></div>
    <button class="btn btn-lg cer-close" id="cer-close">Close</button>
  </div>
</div>

<div id="toasts"></div>

<script>function num(v){ return (v===undefined||v===null||v===""||v==="NA") ? 0 : (Number.isFinite(Number(v)) ? Number(v) : 0); }
/**
 * Fantasy scoring engine.
 *
 * Operates on nflverse `stats_player_week_{season}.csv` rows (the `stats_player`
 * release). Column names below are taken from that schema verbatim — note it
 * uses `passing_interceptions`, not the older `interceptions` from the
 * retired `player_stats` release.
 */


/** Default ruleset: half-PPR, the most common modern league default. */
const DEFAULT_RULES = {
  // Passing
  passYdsPerPoint: 25,
  passTd: 4,
  passInt: -2,
  pass2pt: 2,
  passBonus300: 0,

  // Rushing
  rushYdsPerPoint: 10,
  rushTd: 6,
  rush2pt: 2,
  rushBonus100: 0,

  // Receiving
  recYdsPerPoint: 10,
  recTd: 6,
  rec2pt: 2,
  perReception: 0.5,
  recBonus100: 0,

  // Misc
  fumbleLost: -2,
  specialTeamsTd: 6,

  // Kicking — by distance bucket
  fg0_39: 3,
  fg40_49: 4,
  fg50plus: 5,
  fgMissed: -1,
  pat: 1,
  patMissed: -1,

  // Individual defense (used for D/ST aggregation too)
  defSack: 1,
  defInt: 2,
  defFumbleRec: 2,
  defTd: 6,
  defSafety: 2,
};

const SCORING_PRESETS = {
  standard: { ...DEFAULT_RULES, perReception: 0 },
  half_ppr: { ...DEFAULT_RULES, perReception: 0.5 },
  ppr: { ...DEFAULT_RULES, perReception: 1 },
  ppr_bonus: {
    ...DEFAULT_RULES,
    perReception: 1,
    passBonus300: 3,
    rushBonus100: 3,
    recBonus100: 3,
  },
};

/**
 * Score a single weekly stat line.
 * Returns total points rounded to 2dp, plus a breakdown for the UI.
 */
function scoreStatLine(row, rules = DEFAULT_RULES) {
  const r = { ...DEFAULT_RULES, ...rules };
  const parts = [];
  let total = 0;

  const add = (label, pts) => {
    if (pts === 0) return;
    total += pts;
    parts.push({ label, pts: round2(pts) });
  };

  // ---- Passing
  const passYds = num(row.passing_yards);
  if (passYds) add('Pass yds', passYds / r.passYdsPerPoint);
  add('Pass TD', num(row.passing_tds) * r.passTd);
  add('INT', num(row.passing_interceptions) * r.passInt);
  add('Pass 2PT', num(row.passing_2pt_conversions) * r.pass2pt);
  if (r.passBonus300 && passYds >= 300) add('300yd bonus', r.passBonus300);

  // ---- Rushing
  const rushYds = num(row.rushing_yards);
  if (rushYds) add('Rush yds', rushYds / r.rushYdsPerPoint);
  add('Rush TD', num(row.rushing_tds) * r.rushTd);
  add('Rush 2PT', num(row.rushing_2pt_conversions) * r.rush2pt);
  if (r.rushBonus100 && rushYds >= 100) add('100yd rush bonus', r.rushBonus100);

  // ---- Receiving
  const recYds = num(row.receiving_yards);
  const rec = num(row.receptions);
  if (rec) add('Rec', rec * r.perReception);
  if (recYds) add('Rec yds', recYds / r.recYdsPerPoint);
  add('Rec TD', num(row.receiving_tds) * r.recTd);
  add('Rec 2PT', num(row.receiving_2pt_conversions) * r.rec2pt);
  if (r.recBonus100 && recYds >= 100) add('100yd rec bonus', r.recBonus100);

  // ---- Turnovers. nflverse splits fumbles lost across three columns by the
  // play type that caused them; a player can lose fumbles in more than one.
  const fumblesLost =
    num(row.sack_fumbles_lost) +
    num(row.rushing_fumbles_lost) +
    num(row.receiving_fumbles_lost);
  add('Fumble lost', fumblesLost * r.fumbleLost);

  add('ST TD', num(row.special_teams_tds) * r.specialTeamsTd);

  // ---- Kicking
  const fgShort = num(row.fg_made_0_19) + num(row.fg_made_20_29) + num(row.fg_made_30_39);
  const fgMid = num(row.fg_made_40_49);
  const fgLong = num(row.fg_made_50_59) + num(row['fg_made_60_']);
  add('FG 0-39', fgShort * r.fg0_39);
  add('FG 40-49', fgMid * r.fg40_49);
  add('FG 50+', fgLong * r.fg50plus);
  add('FG miss', num(row.fg_missed) * r.fgMissed);
  add('PAT', num(row.pat_made) * r.pat);
  add('PAT miss', num(row.pat_missed) * r.patMissed);

  // ---- Individual defense
  add('Sack', num(row.def_sacks) * r.defSack);
  add('Def INT', num(row.def_interceptions) * r.defInt);
  add('Fum rec', num(row.fumble_recovery_opp) * r.defFumbleRec);
  add('Def TD', num(row.def_tds) * r.defTd);
  add('Safety', num(row.def_safeties) * r.defSafety);

  return { points: round2(total), parts };
}

/**
 * Aggregate a team's defensive players into a single D/ST line.
 *
 * Caveat worth knowing: real D/ST scoring includes points-allowed and
 * yards-allowed tiers, which are team-level and absent from the player file.
 * This covers the event-driven half (sacks, takeaways, TDs, safeties).
 */
function scoreTeamDefense(teamRows, rules = DEFAULT_RULES) {
  const r = { ...DEFAULT_RULES, ...rules };
  let sacks = 0, ints = 0, fumRec = 0, tds = 0, safeties = 0;

  for (const row of teamRows) {
    sacks += num(row.def_sacks);
    ints += num(row.def_interceptions);
    fumRec += num(row.fumble_recovery_opp);
    tds += num(row.def_tds);
    safeties += num(row.def_safeties);
  }

  const parts = [];
  let total = 0;
  const add = (label, pts) => {
    if (pts === 0) return;
    total += pts;
    parts.push({ label, pts: round2(pts) });
  };

  add('Sacks', sacks * r.defSack);
  add('INT', ints * r.defInt);
  add('Fum rec', fumRec * r.defFumbleRec);
  add('Def TD', tds * r.defTd);
  add('Safety', safeties * r.defSafety);

  return { points: round2(total), parts };
}

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

/** Roster slot definitions. `accepts` lists eligible player positions. */
const SLOTS = {
  QB: { label: 'QB', accepts: ['QB'] },
  RB: { label: 'RB', accepts: ['RB'] },
  WR: { label: 'WR', accepts: ['WR'] },
  TE: { label: 'TE', accepts: ['TE'] },
  FLEX: { label: 'FLEX', accepts: ['RB', 'WR', 'TE'] },
  SUPERFLEX: { label: 'SUPERFLEX', accepts: ['QB', 'RB', 'WR', 'TE'] },
  K: { label: 'K', accepts: ['K'] },
  DST: { label: 'D/ST', accepts: ['DST'] },
  BENCH: { label: 'BE', accepts: ['QB', 'RB', 'WR', 'TE', 'K', 'DST'] },
};

/** Default starting lineup: 1QB, 2RB, 2WR, 1TE, 1FLEX, 1K, 1DST + 6 bench. */
const DEFAULT_ROSTER = {
  QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, K: 1, DST: 1, BENCH: 6,
};

/** Expand a roster spec into an ordered list of concrete slot ids. */
function expandRoster(spec = DEFAULT_ROSTER) {
  const order = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'SUPERFLEX', 'K', 'DST', 'BENCH'];
  const slots = [];
  for (const kind of order) {
    const n = spec[kind] || 0;
    for (let i = 0; i < n; i++) {
      slots.push({ id: `${kind}${i + 1}`, kind, starter: kind !== 'BENCH' });
    }
  }
  return slots;
}

function slotAccepts(kind, position) {
  const def = SLOTS[kind];
  return !!def && def.accepts.includes(position);
}
</script>

(function(){
/* ============================================================================
   3D scenes.
   Built against the core three.js UMD bundle only — no examples/ modules, so
   no EffectComposer. "Bloom" is faked with additive sprite halos and emissive
   materials, which costs a fraction of a real post pass and lets the whole

/* -------------------------------------------------------------- shared env */

/**

 */
function makeStudioEnv(renderer) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x0a0f1c);

  const panel = (color, intensity, w, h, pos, rot) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }),
    );
    m.position.set(...pos);
    if (rot) m.rotation.set(...rot);
    envScene.add(m);
  };

  // Key, fill, rim — plus a warm floor bounce so the gold reads as gold.
  panel(0xffffff, 3.2, 12, 12, [0, 9, 4], [-Math.PI / 2, 0, 0]);
  panel(0xffd27a, 2.4, 10, 8, [-8, 3, 3], [0, Math.PI / 2, 0]);
  panel(0x6fd0ff, 1.9, 10, 8, [8, 3, -1], [0, -Math.PI / 2, 0]);
  panel(0xff5f8f, 1.3, 9, 6, [0, 2, -8], [0, 0, 0]);
  panel(0x2a1c08, 1.0, 16, 16, [0, -4, 0], [Math.PI / 2, 0, 0]);

  const target = pmrem.fromScene(envScene, 0.03);
  pmrem.dispose();
  envScene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  return target.texture;
}

/** Soft radial sprite used for glows, light bloom and beam falloff. */
function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.25, 'rgba(255,255,255,.55)');
  grad.addColorStop(0.55, 'rgba(255,255,255,.14)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================ Trophy build */

/**
 * A classic two-handled cup, revolved from a profile curve.
 * Proportions are hand-tuned: too tall reads as a vase, too wide as a bowl.
 */
function buildTrophy(env) {
  const group = new THREE.Group();

  const gold = new THREE.MeshStandardMaterial({
    color: 0xffc043, metalness: 1.0, roughness: 0.16,
    envMap: env, envMapIntensity: 1.5,
  });
  const darkGold = new THREE.MeshStandardMaterial({
    color: 0x8a6516, metalness: 1.0, roughness: 0.35, envMap: env, envMapIntensity: 1.1,
  });
  const marble = new THREE.MeshStandardMaterial({
    color: 0x161c2b, metalness: 0.3, roughness: 0.55, envMap: env, envMapIntensity: 0.7,
  });

  // --- Cup: profile in (radius, height)
  const pts = [];
  const P = (x, y) => pts.push(new THREE.Vector2(x, y));
  P(0.00, 1.30); P(0.86, 1.30); P(0.92, 1.22); P(0.95, 1.06);
  P(0.90, 0.80); P(0.74, 0.55); P(0.52, 0.34); P(0.34, 0.20);
  P(0.26, 0.10); P(0.24, 0.00);
  const cup = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), gold);
  cup.castShadow = true;
  group.add(cup);

  // Inner surface so the cup does not look like an empty shell from above.
  const inner = new THREE.Mesh(
    new THREE.LatheGeometry(pts.map((p) => new THREE.Vector2(p.x * 0.93, p.y * 0.985 + 0.02)), 64),
    darkGold,
  );
  inner.scale.setScalar(0.99);
  group.add(inner);

  // --- Handles. The torus arc is centred on +X and opens back toward the cup,
  // so each handle bows outward instead of crossing the cup face.
  const ARC = Math.PI * 1.15;
  const handleGeo = new THREE.TorusGeometry(0.33, 0.058, 18, 56, ARC);
  for (const side of [1, -1]) {
    const h = new THREE.Mesh(handleGeo, gold);
    h.rotation.z = -ARC / 2;
    h.castShadow = true;
    // Mirror via a 180° pivot, not a negative scale — negative scale inverts
    // the winding order and the handle would render inside-out.
    const pivot = new THREE.Group();
    pivot.add(h);
    pivot.position.set(side * 0.80, 0.92, 0);
    if (side < 0) pivot.rotation.y = Math.PI;
    group.add(pivot);
  }

  // --- Stem and base
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.34, 32), gold);
  stem.position.y = -0.16;
  group.add(stem);

  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 24), gold);
  knob.position.y = -0.05;
  group.add(knob);

  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.52, 0.14, 48), gold);
  plinth.position.y = -0.40;
  plinth.castShadow = true;
  group.add(plinth);

  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.68, 0.22, 48), marble);
  base.position.y = -0.58;
  base.castShadow = true;
  group.add(base);

  // Nameplate on the base front.
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.12, 0.02), darkGold);
  plate.position.set(0, -0.58, 0.68);
  group.add(plate);

  group.position.y = 0.35;
  return group;
}

/** A football, for the confetti burst and idle orbit. */
function buildFootball(env) {
  const geo = new THREE.SphereGeometry(0.5, 32, 24);
  geo.scale(1, 0.62, 0.62);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x7a3b18, metalness: 0.1, roughness: 0.65, envMap: env, envMapIntensity: 0.8,
  });
  const ball = new THREE.Mesh(geo, mat);

  const laceMat = new THREE.MeshStandardMaterial({ color: 0xf2ede4, roughness: 0.7 });
  const lace = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.035, 0.035), laceMat);
  lace.position.y = 0.31;
  ball.add(lace);
  for (let i = -2; i <= 2; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.028, 0.10), laceMat);
    s.position.set(i * 0.062, 0.315, 0);
    ball.add(s);
  }
  // Stripes near each end.
  for (const x of [-0.31, 0.31]) {
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.196, 0.016, 8, 40), laceMat);
    r.rotation.y = Math.PI / 2;
    r.position.x = x;
    ball.add(r);
  }
  return ball;
}

/* ==================================================== Winner ceremony scene */

class Ceremony {
  constructor(canvas) {
    this.canvas = canvas;
    this.running = false;
    this.raf = null;
    this.clock = null;
  }

  init() {
    if (this.renderer) return;

    const renderer = new THREE.WebGLRenderer({
      canvas: this.canvas, antialias: true, alpha: false, powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer = renderer;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03060c);
    scene.fog = new THREE.FogExp2(0x03060c, 0.055);
    this.scene = scene;

    this.env = makeStudioEnv(renderer);
    this.glow = glowTexture();

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
    camera.position.set(0, 1.5, 7.2);
    this.camera = camera;

    // ---- Lighting
    scene.add(new THREE.AmbientLight(0x2a3a5c, 0.7));

    const key = new THREE.SpotLight(0xfff0d0, 260, 30, Math.PI / 7, 0.45, 1.6);
    key.position.set(3.4, 9, 4.6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.bias = -0.0012;
    scene.add(key, key.target);

    const rim = new THREE.SpotLight(0x4cc9f0, 150, 30, Math.PI / 6, 0.6, 1.6);
    rim.position.set(-5, 6, -4);
    scene.add(rim, rim.target);

    const warm = new THREE.PointLight(0xff9f45, 40, 16, 2);
    warm.position.set(-2.6, 1.4, 2.6);
    scene.add(warm);

    // ---- Stage floor
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x070c16, metalness: 0.62, roughness: 0.34, envMap: this.env, envMapIntensity: 0.55,
    });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(15, 72), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.05;
    floor.receiveShadow = true;
    scene.add(floor);

    // Glowing ring around the podium.
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.85, 2.0, 96),
      new THREE.MeshBasicMaterial({ color: 0xffc531, transparent: true, opacity: 0.55, side: THREE.DoubleSide }),
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -1.04;
    scene.add(ring);
    this.ring = ring;

    // Podium.
    const podium = new THREE.Mesh(
      new THREE.CylinderGeometry(1.5, 1.68, 0.5, 64),
      new THREE.MeshStandardMaterial({ color: 0x0d1424, metalness: 0.5, roughness: 0.42, envMap: this.env }),
    );
    podium.position.y = -0.8;
    podium.castShadow = podium.receiveShadow = true;
    scene.add(podium);

    // ---- Trophy
    this.trophy = buildTrophy(this.env);
    this.trophy.position.y = 0.42;
    scene.add(this.trophy);
    key.target.position.set(0, 0.5, 0);
    rim.target.position.set(0, 0.5, 0);

    // Halo behind the trophy sells the "glow" without a bloom pass.
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.glow, color: 0xffc531, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    halo.scale.set(7, 7, 1);
    halo.position.set(0, 0.6, -1.4);
    scene.add(halo);
    this.halo = halo;

    // ---- Light beams sweeping the stage
    this.beams = [];
    const beamGeo = new THREE.ConeGeometry(1.5, 11, 28, 1, true);
    for (let i = 0; i < 5; i++) {
      const beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({
        color: [0xffc531, 0x4cc9f0, 0x00e5a0, 0xff2d6f, 0xffffff][i],
        transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending,
        depthWrite: false, side: THREE.DoubleSide,
      }));
      beam.position.set(Math.cos(i * 1.9) * 4.2, 5.2, Math.sin(i * 1.9) * 3.2);
      beam.userData.phase = i * 1.3;
      scene.add(beam);
      this.beams.push(beam);
    }

    // ---- Orbiting footballs
    this.balls = [];
    for (let i = 0; i < 3; i++) {
      const b = buildFootball(this.env);
      b.scale.setScalar(0.5);
      b.userData = { a: (i / 3) * Math.PI * 2, r: 3.1 + i * 0.22, y: 0.5 + i * 0.55, spin: 0.9 + i * 0.4 };
      scene.add(b);
      this.balls.push(b);
    }

    this.initConfetti();
    this.initStars();

    this.onResize = () => this.resize();
    addEventListener('resize', this.onResize);
  }

  /** Instanced confetti — one draw call for a few thousand ribbons. */
  initConfetti() {
    const COUNT = 1400;
    const geo = new THREE.PlaneGeometry(0.11, 0.17);
    const mat = new THREE.MeshStandardMaterial({
      side: THREE.DoubleSide, metalness: 0.45, roughness: 0.35,
      envMap: this.env, envMapIntensity: 1.0, vertexColors: true,
    });

    const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;

    const palette = [0xffc531, 0x00e5a0, 0x4cc9f0, 0xff2d6f, 0xb892ff, 0xffffff].map((c) => new THREE.Color(c));
    const colors = new Float32Array(COUNT * 3);
    for (let i = 0; i < COUNT; i++) {
      palette[i % palette.length].toArray(colors, i * 3);
    }
    geo.setAttribute('color', new THREE.InstancedBufferAttribute(colors, 3));

    this.confetti = mesh;
    this.confettiState = new Array(COUNT);
    for (let i = 0; i < COUNT; i++) this.confettiState[i] = this.spawnConfetti(true);
    this.scene.add(mesh);
    this._m4 = new THREE.Matrix4();
    this._q = new THREE.Quaternion();
    this._e = new THREE.Euler();
    this._v = new THREE.Vector3();
    this._s = new THREE.Vector3(1, 1, 1);
  }

  spawnConfetti(initial) {
    const spread = 9;
    return {
      x: (Math.random() - 0.5) * spread,
      y: initial ? Math.random() * 12 + 1 : 9 + Math.random() * 5,
      z: (Math.random() - 0.5) * spread - 1,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -0.9 - Math.random() * 1.5,
      vz: (Math.random() - 0.5) * 0.5,
      rx: Math.random() * Math.PI, ry: Math.random() * Math.PI, rz: Math.random() * Math.PI,
      drx: (Math.random() - 0.5) * 4, dry: (Math.random() - 0.5) * 4, drz: (Math.random() - 0.5) * 4,
      sway: Math.random() * Math.PI * 2,
    };
  }

  /** Distant sparkle field for depth. */
  initStars() {
    const N = 420;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = 16 + Math.random() * 22;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.random() * Math.PI * 0.55;
      pos[i * 3] = Math.cos(th) * Math.sin(ph) * r;
      pos[i * 3 + 1] = Math.cos(ph) * r * 0.7 + 2;
      pos[i * 3 + 2] = Math.sin(th) * Math.sin(ph) * r;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.stars = new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.12, map: this.glow, color: 0xbfd8ff, transparent: true,
      opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    this.scene.add(this.stars);
  }

  resize() {
    if (!this.renderer) return;
    const w = this.canvas.clientWidth || innerWidth;
    const h = this.canvas.clientHeight || innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  start() {
    this.init();
    this.resize();
    this.running = true;
    this.t0 = performance.now();
    this.clock = this.clock || new THREE.Clock();
    this.clock.start();
    const loop = () => {
      if (!this.running) return;
      this.raf = requestAnimationFrame(loop);
      this.frame();
    };
    loop();
  }

  stop() {
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.clock) this.clock.stop();
  }

  frame() {
    const dt = Math.min(this.clock.getDelta(), 0.05);
    const t = (performance.now() - this.t0) / 1000;

    // Camera: slow dolly in, then a gentle drift. The look-at sits high so the
    // trophy rides in the upper half and the lower third stays clear for text.
    const ease = 1 - Math.pow(1 - Math.min(t / 2.6, 1), 3);
    const dist = 10.2 - ease * 2.2;
    this.camera.position.x = Math.sin(t * 0.16) * 0.9;
    this.camera.position.y = 1.9 + Math.sin(t * 0.23) * 0.16 + (1 - ease) * 0.7;
    this.camera.position.z = dist;
    this.camera.lookAt(0, 1.15, 0);

    // Trophy: spin plus a slow bob.
    this.trophy.rotation.y = t * 0.55;
    this.trophy.position.y = 0.42 + Math.sin(t * 1.25) * 0.055;

    this.ring.material.opacity = 0.4 + Math.sin(t * 2.1) * 0.16;
    this.ring.scale.setScalar(1 + Math.sin(t * 1.4) * 0.015);
    this.halo.material.opacity = 0.42 + Math.sin(t * 1.7) * 0.1;

    for (const beam of this.beams) {
      const p = beam.userData.phase;
      beam.rotation.z = Math.sin(t * 0.5 + p) * 0.32;
      beam.rotation.x = Math.cos(t * 0.38 + p) * 0.22;
      beam.material.opacity = 0.05 + (Math.sin(t * 1.1 + p) * 0.5 + 0.5) * 0.07;
    }

    for (const b of this.balls) {
      const u = b.userData;
      u.a += dt * 0.42;
      b.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.9 + u.a) * 0.25, Math.sin(u.a) * u.r * 0.72);
      b.rotation.x += dt * u.spin;
      b.rotation.z += dt * u.spin * 0.6;
    }

    this.stars.rotation.y = t * 0.012;
    this.updateConfetti(dt, t);

    this.renderer.render(this.scene, this.camera);
  }

  updateConfetti(dt, t) {
    const st = this.confettiState;
    for (let i = 0; i < st.length; i++) {
      const p = st[i];
      p.sway += dt * 2.4;
      p.x += (p.vx + Math.sin(p.sway) * 0.55) * dt;
      p.y += p.vy * dt;
      p.z += (p.vz + Math.cos(p.sway * 0.8) * 0.35) * dt;
      p.rx += p.drx * dt; p.ry += p.dry * dt; p.rz += p.drz * dt;

      if (p.y < -1.2) st[i] = this.spawnConfetti(false);

      this._e.set(p.rx, p.ry, p.rz);
      this._q.setFromEuler(this._e);
      this._v.set(p.x, p.y, p.z);
      this._m4.compose(this._v, this._q, this._s);
      this.confetti.setMatrixAt(i, this._m4);
    }
    this.confetti.instanceMatrix.needsUpdate = true;
  }

  dispose() {
    this.stop();
    removeEventListener('resize', this.onResize);
    if (this.renderer) {
      this.scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach((m) => { Object.values(m).forEach((v) => v && v.isTexture && v.dispose()); m.dispose(); });
        }
      });
      this.renderer.dispose();
      this.renderer = null;
    }
  }
}

/* ================================================== Gate hero: field of light */

class HeroField {
  constructor(canvas) {
    this.canvas = canvas;
    this.running = false;
    this.mouse = { x: 0, y: 0 };
  }

  start() {
    if (this.renderer) { this.running = true; this.loop(); return; }

    const renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer = renderer;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05080f, 0.035);
    this.scene = scene;

    const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 220);
    camera.position.set(0, 3.6, 13);
    camera.lookAt(0, 0, -22);
    this.camera = camera;

    // Receding field: yard lines that scroll toward the viewer.
    const lineMat = new THREE.LineBasicMaterial({ color: 0x1d6f57, transparent: true, opacity: 0.55 });
    const field = new THREE.Group();
    this.yardLines = [];
    for (let i = 0; i < 44; i++) {
      const g = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-16, 0, 0), new THREE.Vector3(16, 0, 0),
      ]);
      const l = new THREE.Line(g, lineMat.clone());
      l.position.z = -i * 4.2;
      field.add(l);
      this.yardLines.push(l);
    }
    // Sidelines.
    for (const x of [-16, 16]) {
      const g = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, 0, 12), new THREE.Vector3(x, 0, -180),
      ]);
      field.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x27a37c, transparent: true, opacity: 0.4 })));
    }
    field.position.y = -2.6;
    scene.add(field);
    this.field = field;

    // Drifting motes.
    const N = 340;
    const pos = new Float32Array(N * 3);
    this.motes = [];
    for (let i = 0; i < N; i++) {
      const p = { x: (Math.random() - 0.5) * 44, y: Math.random() * 16 - 3, z: -Math.random() * 130 + 10, s: 0.2 + Math.random() * 0.6 };
      this.motes.push(p);
      pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.points = new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.30, map: glowTexture(), color: 0x63f5c4, transparent: true,
      opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    scene.add(this.points);

    this.onMove = (e) => {
      this.mouse.x = (e.clientX / innerWidth - 0.5) * 2;
      this.mouse.y = (e.clientY / innerHeight - 0.5) * 2;
    };
    this.onResize = () => this.resize();
    addEventListener('pointermove', this.onMove, { passive: true });
    addEventListener('resize', this.onResize);

    this.clock = new THREE.Clock();
    this.running = true;
    this.resize();
    this.loop();
  }

  resize() {
    if (!this.renderer) return;
    const w = innerWidth, h = innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  loop() {
    if (!this.running) return;
    this.raf = requestAnimationFrame(() => this.loop());
    const dt = Math.min(this.clock.getDelta(), 0.05);
    const t = this.clock.elapsedTime;

    // Scroll yard lines forward, recycling them behind the camera.
    for (const l of this.yardLines) {
      l.position.z += dt * 6.5;
      if (l.position.z > 14) l.position.z -= 44 * 4.2;
      const d = Math.abs(l.position.z + 60) / 90;
      l.material.opacity = Math.max(0, 0.6 - d * 0.5);
    }

    const arr = this.points.geometry.attributes.position.array;
    for (let i = 0; i < this.motes.length; i++) {
      const p = this.motes[i];
      p.z += dt * 4.2 * p.s;
      p.y += Math.sin(t * 0.6 + i) * dt * 0.22;
      if (p.z > 12) { p.z = -130; p.x = (Math.random() - 0.5) * 44; }
      arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z;
    }
    this.points.geometry.attributes.position.needsUpdate = true;

    // Parallax.
    this.camera.position.x += (this.mouse.x * 1.6 - this.camera.position.x) * 0.035;
    this.camera.position.y += (3.6 - this.mouse.y * 0.9 - this.camera.position.y) * 0.035;
    this.camera.lookAt(0, 0.4, -24);

}

/* ============================================ Lightweight 2D pick confetti */

/**
 * Draft picks fire many times a minute, so they get a cheap 2D burst rather
 * than spinning up a second WebGL context.
 */
function pickBurst(color = '#00e5a0') {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:120';
  canvas.width = innerWidth; canvas.height = innerHeight;
  document.body.appendChild(canvas);
  const g = canvas.getContext('2d');

  const colors = [color, '#ffc531', '#ffffff', '#4cc9f0'];
  const parts = [];
  const cx = innerWidth / 2, cy = innerHeight * 0.34;
  for (let i = 0; i < 110; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 5 + Math.random() * 13;
    parts.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
      w: 4 + Math.random() * 6, h: 7 + Math.random() * 9,
      rot: Math.random() * 6.28, dr: (Math.random() - 0.5) * 0.4,
      c: colors[(Math.random() * colors.length) | 0], life: 1,
    });

  let raf;
  const tick = () => {
    g.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of parts) {
      p.vy += 0.42;
      p.vx *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.dr;
      p.life -= 0.0125;

      g.fillStyle = p.c;
      g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();

    if (alive) raf = requestAnimationFrame(tick);
    else { cancelAnimationFrame(raf); canvas.remove(); }
  };
  tick();
}

<script>
/* ============================================================================
   Gridiron — fantasy football league

/* ------------------------------------------------------------------ helpers */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmt = (n) => (Math.round(n * 100) / 100).toFixed(2);
const fmt1 = (n) => (Math.round(n * 10) / 10).toFixed(1);

function el(tag, attrs = {}, html = '') {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v != null) n.setAttribute(k, v);
  }
  if (html) n.innerHTML = html;
  return n;
}

function toast(msg, kind = '') {
  const t = el('div', { class: `toast ${kind}` }, esc(msg));
  $('#toasts').appendChild(t);

/** Deterministic PRNG so simulated weeks are stable across reloads and views. */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

/** Box-Muller, for realistic weekly variance around a player's average. */
