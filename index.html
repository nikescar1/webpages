<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pages</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  li { margin: .25rem 0; }
  .err { color: #c00; }
</style>
</head>
<body>
<h1>Pages</h1>
<ul id="list"><li>Loading…</li></ul>
<script>
const USER = "nikescar1";
const REPO = "webpages";
const BRANCH = "main";

fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`)
  .then(r => {
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  })
  .then(data => {
    const files = (data.tree || [])
      .filter(f => f.type === "blob" && f.path.endsWith(".html") && f.path !== "index.html");
    const ul = document.getElementById("list");
    ul.innerHTML = files.length
      ? files.map(f => `<li><a href="${f.path}">${f.path}</a></li>`).join("")
      : "<li>No pages found.</li>";
  })
  .catch(err => {
    document.getElementById("list").innerHTML =
      `<li class="err">Failed to load: ${err.message}</li>`;
  });
</script>
</body>
</html>
