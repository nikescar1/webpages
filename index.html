<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Index</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  li { margin: .25rem 0; }
</style>
</head>
<body>
<h1>Pages</h1>
<ul id="list"><li>Loading…</li></ul>
<script>
const USER = "nikescar1";
const REPO = "nikescar1.github.io";
const BRANCH = "main";

fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`)
  .then(r => r.json())
  .then(data => {
    const files = data.tree
      .filter(f => f.type === "blob" && f.path.endsWith(".html") && f.path !== "index.html");
    const ul = document.getElementById("list");
    ul.innerHTML = files.map(f =>
      `<li><a href="${f.path}">${f.path}</a></li>`
    ).join("") || "<li>No pages found.</li>";
  });
</script>
</body>
</html>
