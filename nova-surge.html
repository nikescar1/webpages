  particles.length=0; popups.length=0;
  cam.x=cam.y=0; cam.shake=0;
  gridPulse=0;
  Save.data.plays++; Save.write();
  nextWave();
}

/* ---------------- Waves & spawning ---------------- */
function isBossWave(n){ return n % Math.max(1, Math.round(CFG.waves.bossEvery)) === 0; }
function waveBudget(n){
  const Wv = CFG.waves;
  return Math.round(Wv.baseBudget + n*Wv.budgetPerWave + n*n*Wv.budgetQuad);
}

function nextWave(){
  game.wave++;
  const n = game.wave, Wv = CFG.waves;
  const sp = game.spawner;
  sp.interval = Math.max(Wv.intervalMin, Wv.intervalStart - n*Wv.intervalPerWave);
  sp.spawnT = 1.4;
  sp.clearing = false;
  if (isBossWave(n)){
    sp.budget = Math.round(waveBudget(n) * 0.4);
    const cyc = Math.max(1, Math.round(n / Wv.bossEvery));
    const count = Math.min(Math.round(CFG.boss.maxCount),
      1 + Math.floor((cyc-1) / Math.max(1, Math.round(CFG.boss.extraEvery))));
    spawnBosses(count, cyc);
    UI.banner('WAVE '+n, count>1 ? '⚠ '+count+' DREADNOUGHTS DETECTED ⚠' : '⚠ DREADNOUGHT DETECTED ⚠');
    SFX.bossRoar();
    Music.intensity = 3;
  } else {
    sp.budget = waveBudget(n);
    UI.banner('WAVE '+n, n===1 ? 'SURVIVE THE SWARM' : '');
    SFX.waveStart();
    Music.intensity = n<3 ? 1 : (n<6 ? 2 : (isBossWave(n+1) ? 3 : 2));
  }
  UI.setWave(n);
}

function pickEnemyType(){
  const n = game.wave;
  let total = 0;
  for (const k in ENEMY_TYPES){ const t=ENEMY_TYPES[k]; if (n>=t.minWave && t.w>0) total += t.w; }
  let r = rand(total);
  for (const k in ENEMY_TYPES){
    const t = ENEMY_TYPES[k];
    if (n>=t.minWave && t.w>0){ r -= t.w; if (r<=0) return k; }
  }
  return 'chaser';
}

function spawnPos(){
  const p = game.player, vh = viewHalf(), A = CFG.arena/2 - 60;
  const viewR = Math.hypot(vh.w, vh.h);
  for (let tries=0; tries<14; tries++){
    const a = rand(TAU), d = viewR + rand(60, 260);
    const x = clamp(p.x + Math.cos(a)*d, -A, A);
    const y = clamp(p.y + Math.sin(a)*d, -A, A);
    // must be off-screen-ish (clamping can pull it back into view near walls)
    if (Math.abs(x - (cam.x)) > vh.w*0.7 || Math.abs(y - (cam.y)) > vh.h*0.7 || tries===13)
      return {x,y};
  }
  return {x:clamp(p.x+500,-A,A), y:clamp(p.y+500,-A,A)};
}

function spawnEnemy(type, x, y, noFx){
  const T = ENEMY_TYPES[type];
  const n = game.wave;
  const hpMul = 1 + (n-1)*CFG.waves.hpScale;
  const spMul = Math.min(CFG.waves.speedScaleCap, 1 + (n-1)*CFG.waves.speedScale);
  const e = {
    type, x, y, vx:0, vy:0,
    hp: T.hp*hpMul, maxHp: T.hp*hpMul,
    r: T.r, speed: T.speed*spMul, dmg: T.dmg, score: T.score, xp: T.xp,
    color: T.color, ang: rand(TAU), spin: rand(-2,2),
    spawnT: noFx?0:0.75, hitT: 0, seed: rand(TAU), fireT: rand(1.5,3), chargeT: rand(1.5,3), boss:false,
    dartT: rand(2,5), telT: 0, dashT: 0, aimAng: 0, phaseT: rand(1.2,2.2), phased: false,
  };
  game.enemies.push(e);
  if (!noFx) ring(x, y, T.color, 4, 160, 0.5, 3);
  return e;
}

function trySpawnGroup(dt){
  const sp = game.spawner;
  sp.spawnT -= dt;
  if (sp.spawnT > 0 || sp.budget <= 0) return;
  if (game.enemies.length >= CFG.waves.maxEnemies){ sp.spawnT = 0.5; return; }
  sp.spawnT = sp.interval * rand(0.75, 1.25);
  let groupCost = randi(CFG.waves.groupMin, CFG.waves.groupMax);
  // cluster spawns feel deliberate: pick one anchor, scatter around it
  const anchor = spawnPos();
  let guard = 20;
  while (groupCost > 0 && sp.budget > 0 && guard-- > 0){
    const type = pickEnemyType();
    const T = ENEMY_TYPES[type];
    if (T.cost > sp.budget + 0.5 ) continue;
    const A = CFG.arena/2 - 40;
    spawnEnemy(type,
      clamp(anchor.x + rand(-90,90), -A, A),
      clamp(anchor.y + rand(-90,90), -A, A));
    sp.budget -= T.cost;
    groupCost -= T.cost;
  }
}

function checkWaveEnd(dt){
  const sp = game.spawner;
  if (sp.budget > 0 && sp.budget < 0.9) sp.budget = 0; // flush unspendable remainder
  if (sp.budget <= 0 && game.enemies.length === 0){
    if (!sp.clearing){ sp.clearing = true; sp.waitT = CFG.waves.intermission; }
    sp.waitT -= dt;
    if (sp.waitT <= 0) nextWave();
  }
}

/* ---------------- Boss ---------------- */
function spawnBosses(count, cyc){
  const p = game.player, A = CFG.arena/2-140;
  const hpMul = count > 1 ? CFG.boss.multiHpMul : 1;
  const hp = CFG.boss.baseHp * (1 + (cyc-1)*CFG.boss.hpPerCycle) * hpMul;
  const a0 = rand(TAU);
  for (let i=0;i<count;i++){
    const a = a0 + i*TAU/count;
    game.enemies.push({
      boss:true, type:'boss',
      x: clamp(p.x+Math.cos(a)*900, -A, A), y: clamp(p.y+Math.sin(a)*900, -A, A),
      vx:0, vy:0, hp, maxHp:hp, r:CFG.boss.r, dmg:CFG.boss.contactDmg,
      score: CFG.boss.score*cyc, xp: 0, color:'#ff5ad2',
      ang:0, spin:0.8, spawnT:1.2, hitT:0, seed:rand(TAU),
      attackT: 2.2 + i*1.1, attack:null, attackPhase:0, dashT:0, dashA:0, speed:70,
      fireT:0, telT:0, aimAng:0, phased:false,
    });
  }
  UI.showBossBar(true);
  UI.setBossCount(count);
}

function bossUpdate(b, dt){
  const p = game.player;
  const frac = b.hp / b.maxHp;
  const phase = frac > 0.66 ? 0 : frac > 0.33 ? 1 : 2;
  b.spin = 0.8 + phase*0.5;

  // movement: keep mid distance unless dashing
  const dx = p.x-b.x, dy = p.y-b.y, d = Math.hypot(dx,dy)||1;
  if (b.attack === 'dash'){
    b.dashT -= dt;
    if (b.attackPhase === 0){ // telegraph
      b.vx *= (1-4*dt); b.vy *= (1-4*dt);
      if (b.dashT <= 0){ b.attackPhase=1; b.dashT=0.55; b.dashA=Math.atan2(dy,dx);
        SFX.bossRoar(); addShake(6); ring(b.x,b.y,'#ff5ad2',b.r,420,0.5,5); }
    } else {
      const sp = 820;
      b.vx = Math.cos(b.dashA)*sp; b.vy = Math.sin(b.dashA)*sp;
      if (b.dashT <= 0){ b.attack=null; b.attackT = rand(1.6,2.6) - phase*0.3; }
    }
  } else {
    const want = 340;
    const sp = b.speed*(1+phase*0.35) * (d>want? 1 : -0.6);
    b.vx = lerp(b.vx, dx/d*sp, 1.6*dt);
    b.vy = lerp(b.vy, dy/d*sp, 1.6*dt);
    // orbit drift
    b.vx += -dy/d * 40 * dt * 6;
    b.vy +=  dx/d * 40 * dt * 6;
  }

  // attacks
  if (b.attack === 'spiral'){
    b.dashT -= dt;
    b.seed += dt * (5+phase);
    if (b.dashT > 0){
      b.fireT = (b.fireT||0) - dt;
      if (b.fireT <= 0){
        b.fireT = 0.11 - phase*0.015;
        for (let k=0;k<2;k++){
          const a = b.seed + k*Math.PI;
          fireEBullet(b.x+Math.cos(a)*b.r, b.y+Math.sin(a)*b.r, a, 0.85);
        }
      }
    } else { b.attack = null; b.attackT = rand(1.6,2.4) - phase*0.3; }
  } else if (b.attack === 'burst'){
    b.dashT -= dt;
    if (b.dashT <= 0){
      b.attackPhase++;
      const aim = Math.atan2(p.y-b.y, p.x-b.x);
      for (let i=-2;i<=2;i++) fireEBullet(b.x, b.y, aim + i*0.13, 1.15);
      SFX.enemyDie(false);
      b.dashT = 0.5;
      if (b.attackPhase >= 3+phase){ b.attack=null; b.attackT = rand(1.8,2.6)-phase*0.3; }
    }
  } else if (b.attack === 'summon'){
    const n = 3 + phase*2;
    for (let i=0;i<n;i++){
      const a = rand(TAU);
      spawnEnemy(pick(['chaser','weaver','mini']), b.x+Math.cos(a)*(b.r+50), b.y+Math.sin(a)*(b.r+50));
    }
    ring(b.x,b.y,'#5aff8a',b.r,380,0.6,4);
    b.attack=null; b.attackT = rand(2.4,3.4)-phase*0.4;
  }

  if (!b.attack){
    b.attackT -= dt;
    if (b.attackT <= 0 && b.spawnT<=0){
      const pool = phase===0 ? ['spiral','burst','summon']
                 : phase===1 ? ['spiral','burst','summon','dash']
                 : ['spiral','burst','dash','dash','summon'];
      b.attack = pick(pool);
      b.attackPhase = 0;
      if (b.attack==='spiral'){ b.dashT = 2.2+phase*0.5; b.fireT = 0; }
      else if (b.attack==='burst'){ b.dashT = 0.4; }
      else if (b.attack==='dash'){ b.dashT = 0.7; addShake(3);
        ring(b.x,b.y,'#ffd24d',b.r+10,-60,0.7,4); }
    }
  }
}

/* ---------------- Enemy bullets ---------------- */
function fireEBullet(x,y,ang,spMul){
  if (game.ebullets.length > 240) return;
  const E = CFG.ebullet;
  const sp = Math.min(E.speedCap, (E.speed + game.wave*E.speedPerWave)) * (spMul||1);
  game.ebullets.push({ x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, r:E.r, life:E.life });
}

/* ---------------- Enemy behaviours ---------------- */
function targetable(e){ return e.spawnT <= 0 && !e.phased; }

function enemyUpdate(e, dt){
  if (e.spawnT > 0){ e.spawnT -= dt; e.ang += e.spin*dt; return; }
  const p = game.player;
  if (e.boss){ bossUpdate(e, dt); }
  else switch(e.type){
    case 'chaser': case 'mini': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.vx = lerp(e.vx, dx/d*e.speed, 3*dt);
      e.vy = lerp(e.vy, dy/d*e.speed, 3*dt);
      break;
    }
    case 'weaver': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.seed += dt*4.5;
      const s = Math.sin(e.seed)*0.9;
      const ax = dx/d, ay = dy/d;
      e.vx = lerp(e.vx, (ax + -ay*s)*e.speed, 4*dt);
      e.vy = lerp(e.vy, (ay +  ax*s)*e.speed, 4*dt);
      break;
    }
    case 'drifter': {
      e.seed += dt*0.7;
      const a = e.seed*1.7 + Math.sin(e.seed*2.3)*2;
      e.vx = lerp(e.vx, Math.cos(a)*e.speed, 1.2*dt);
      e.vy = lerp(e.vy, Math.sin(a)*e.speed, 1.2*dt);
      // gentle bias toward player so they don't wander off forever
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.vx += dx/d*24*dt; e.vy += dy/d*24*dt;
      break;
    }
    case 'splitter': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.vx = lerp(e.vx, dx/d*e.speed, 2.2*dt);
      e.vy = lerp(e.vy, dy/d*e.speed, 2.2*dt);
      break;
    }
    case 'shooter': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      const want = 430;
      const toward = d > want ? 1 : (d < want*0.7 ? -1 : 0);
      e.vx = lerp(e.vx, dx/d*e.speed*toward + -dy/d*e.speed*0.45, 2.5*dt);
      e.vy = lerp(e.vy, dy/d*e.speed*toward +  dx/d*e.speed*0.45, 2.5*dt);
      e.fireT -= dt;
      if (e.fireT <= 0 && d < 900){
        e.fireT = rand(2.2, 3.2);
        const aim = Math.atan2(dy,dx);
        fireEBullet(e.x, e.y, aim, 1);
        ring(e.x, e.y, e.color, e.r*0.5, 140, 0.3, 2);
      }
      break;
    }
    case 'tank': {
      e.chargeT -= dt;
      if (e.chargeT <= -2.4) e.chargeT = rand(3,5); // cycle
      const charging = e.chargeT < 0;
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      const sp = charging ? e.speed*3.4 : e.speed;
      e.vx = lerp(e.vx, dx/d*sp, (charging?2.4:1.4)*dt);
      e.vy = lerp(e.vy, dy/d*sp, (charging?2.4:1.4)*dt);
      break;
    }
    case 'orbiter': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.dartT -= dt;
      if (e.dartT <= 0 && e.dartT > -0.55){ // darting at the player
        e.vx = lerp(e.vx, dx/d*e.speed*2.8, 6*dt);
        e.vy = lerp(e.vy, dy/d*e.speed*2.8, 6*dt);
      } else {
        if (e.dartT <= -0.55){ e.dartT = rand(3.5,6); ring(e.x,e.y,e.color,e.r*0.6,180,0.3,2); }
        const rad = clamp((d-300)*1.8, -e.speed, e.speed*1.5);
        e.vx = lerp(e.vx, dx/d*rad + -dy/d*e.speed, 3*dt);
        e.vy = lerp(e.vy, dy/d*rad +  dx/d*e.speed, 3*dt);
      }
      break;
    }
    case 'charger': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      if (e.dashT > 0){
        e.dashT -= dt;
        if (e.dashT <= 0) e.chargeT = rand(1.6,2.6);
      } else if (e.telT > 0){
        e.telT -= dt;
        if (e.telT > 0.15) e.aimAng = Math.atan2(dy,dx); // track, then lock
        e.vx *= (1-6*dt); e.vy *= (1-6*dt);
        if (e.telT <= 0){
          e.dashT = 0.5;
          e.vx = Math.cos(e.aimAng)*760; e.vy = Math.sin(e.aimAng)*760;
          ring(e.x,e.y,e.color,e.r,300,0.35,3);
        }
      } else {
        e.chargeT -= dt;
        e.vx = lerp(e.vx, dx/d*e.speed, 2*dt);
        e.vy = lerp(e.vy, dy/d*e.speed, 2*dt);
        if (e.chargeT <= 0 && d < 800) e.telT = 0.55;
      }
      break;
    }
    case 'sniper': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      const want = 650;
      const toward = d>want ? 1 : (d<want*0.75 ? -1 : 0);
      e.vx = lerp(e.vx, dx/d*e.speed*toward + -dy/d*e.speed*0.5, 2.2*dt);
      e.vy = lerp(e.vy, dy/d*e.speed*toward +  dx/d*e.speed*0.5, 2.2*dt);
      if (e.telT > 0){
        e.telT -= dt;
        if (e.telT > 0.2) e.aimAng = Math.atan2(dy,dx); // track, then lock
        if (e.telT <= 0){
          fireEBullet(e.x+Math.cos(e.aimAng)*e.r, e.y+Math.sin(e.aimAng)*e.r, e.aimAng, 2.1);
          ring(e.x, e.y, e.color, e.r*0.5, 180, 0.3, 2);
          e.fireT = rand(2.5,4);
        }
      } else {
        e.fireT -= dt;
        if (e.fireT <= 0 && d < 1000) e.telT = 0.9;
      }
      break;
    }
    case 'healer': {
      let tx=null, ty=null, bd=1e12;
      for (const o of game.enemies){
        if (o===e || o.boss || o.spawnT>0 || o.hp>=o.maxHp) continue;
        const q = dist2(e.x,e.y,o.x,o.y);
        if (q<bd){ bd=q; tx=o.x; ty=o.y; }
      }
      const dx=(tx===null?p.x:tx)-e.x, dy=(ty===null?p.y:ty)-e.y, d=Math.hypot(dx,dy)||1;
      const keep = tx===null ? 520 : 40;
      const toward = d>keep ? 1 : -0.5;
      e.vx = lerp(e.vx, dx/d*e.speed*toward, 2*dt);
      e.vy = lerp(e.vy, dy/d*e.speed*toward, 2*dt);
      e.fireT -= dt;
      if (e.fireT <= 0){
        e.fireT = 2.2;
        let healed = false;
        for (const o of game.enemies){
          if (o===e || o.boss || o.spawnT>0 || o.hp>=o.maxHp) continue;
          if (dist2(e.x,e.y,o.x,o.y) < 220*220){
            o.hp = Math.min(o.maxHp, o.hp + o.maxHp*0.1);
            healed = true;
          }
        }
        if (healed) ring(e.x,e.y,'#7dffb0',e.r,260,0.6,3);
      }
      break;
    }
    case 'spinner': {
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.vx = lerp(e.vx, dx/d*e.speed, 1.5*dt);
      e.vy = lerp(e.vy, dy/d*e.speed, 1.5*dt);
      e.fireT -= dt;
      if (e.fireT <= 0 && d < 900){
        e.fireT = 0.5;
        e.seed += 0.55;
        for (let k=0;k<4;k++) fireEBullet(e.x, e.y, e.seed + k*Math.PI/2, 0.7);
      }
      break;
    }
    case 'phantom': {
      e.phaseT -= dt;
      if (e.phaseT <= 0){
        e.phased = !e.phased;
        e.phaseT = e.phased ? rand(1.2,1.6) : rand(1.8,2.4);
        if (!e.phased) ring(e.x,e.y,e.color,e.r*0.6,220,0.4,3);
      }
      const dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      const sp = e.phased ? e.speed*1.5 : e.speed;
      e.vx = lerp(e.vx, dx/d*sp, 3*dt);
      e.vy = lerp(e.vy, dy/d*sp, 3*dt);
      break;
    }
  }
  e.x += e.vx*dt; e.y += e.vy*dt;
  e.ang += e.spin*dt;
  e.hitT = Math.max(0, e.hitT - dt);
  const A = CFG.arena/2 - e.r;
  if (e.x < -A){ e.x=-A; e.vx = Math.abs(e.vx)*0.6; }
  if (e.x >  A){ e.x= A; e.vx = -Math.abs(e.vx)*0.6; }
  if (e.y < -A){ e.y=-A; e.vy = Math.abs(e.vy)*0.6; }
  if (e.y >  A){ e.y= A; e.vy = -Math.abs(e.vy)*0.6; }
}

function separateEnemies(dt){
  const es = game.enemies, n = es.length;
  for (let i=0;i<n;i++){
    const a = es[i];
    if (a.spawnT>0) continue;
    for (let j=i+1;j<n;j++){
      const b = es[j];
      if (b.spawnT>0) continue;
      const rr = a.r + b.r;
      const dx = b.x-a.x, dy = b.y-a.y;
      if (Math.abs(dx)>rr || Math.abs(dy)>rr) continue;
      const d2 = dx*dx+dy*dy;
      if (d2 >= rr*rr || d2 === 0) continue;
      const d = Math.sqrt(d2), push = (rr-d)/d * 0.5;
      const px = dx*push, py = dy*push;
      const wa = a.boss?0:1, wb = b.boss?0:1;
      a.x -= px*wa; a.y -= py*wa;
      b.x += px*wb; b.y += py*wb;
    }
  }
}

/* ---------------- Damage & death ---------------- */
function damageEnemy(e, dmg, kx, ky){
  if (e.spawnT > 0 || e.phased) return;
  e.hp -= dmg;
  e.hitT = 0.08;
  if (!e.boss){ e.vx += (kx||0); e.vy += (ky||0); }
  SFX.enemyHit();
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  const idx = game.enemies.indexOf(e);
  if (idx < 0) return;
  game.enemies.splice(idx,1);

  game.kills++; game.streak++;
  const newMult = Math.min(CFG.mult.max, 1 + Math.floor(game.streak/CFG.mult.killsPerStep));
  if (newMult > game.mult){ game.mult = newMult; game.maxMult = Math.max(game.maxMult,newMult);
    popup(e.x, e.y-24, '×'+newMult+' MULTIPLIER', '#ffd24d', true); }
  const pts = Math.round(e.score * game.mult);
  game.score += pts;
  popup(e.x, e.y, '+'+fmt(pts), e.boss ? '#ffd24d' : '#cfe9ff', e.boss);

  const big = e.boss || e.type==='tank';
  burst(e.x, e.y, e.color, big?60:22, big?520:340, big?0.9:0.55, big?5:3.5);
  ring(e.x, e.y, e.color, e.r*0.5, big?520:300, big?0.8:0.45, big?5:3);
  SFX.enemyDie(big);
  addShake(big ? CFG.shake.big : CFG.shake.kill);
  gridPulse = Math.min(1, gridPulse + (big?0.5:0.12));
  if (big) game.hitStop = Math.max(game.hitStop, 0.06);

  // drops
  const nGems = e.boss ? 24 : e.xp;
  for (let i=0;i<nGems;i++){
    const a = rand(TAU), d = rand(4, 14+nGems*2);
    game.gems.push({ x:e.x+Math.cos(a)*d, y:e.y+Math.sin(a)*d,
      vx:Math.cos(a)*rand(60,220), vy:Math.sin(a)*rand(60,220), life:CFG.gem.life });
  }
  const p = game.player;
  if (p && !game.over && p.stats.leech > 0 && p.hp < p.maxHp){
    p.hp = Math.min(p.maxHp, p.hp + p.stats.leech);
    UI.dirtyHp = true;
  }
  if ((e.type==='tank') || (p.hp < p.maxHp*0.7 && Math.random()<CFG.heart.chance) || (e.boss && p.hp<p.maxHp))
    game.hearts.push({ kind:'heal', x:e.x, y:e.y, vx:rand(-60,60), vy:rand(-60,60), life:CFG.heart.life });
  else if (game.bombs < game.bombMax && Math.random() < CFG.bombDrop.chance)
    game.hearts.push({ kind:'bomb', x:e.x, y:e.y, vx:rand(-60,60), vy:rand(-60,60), life:CFG.heart.life });

  if (e.type === 'splitter'){
    for (let i=0;i<2;i++){
      const m = spawnEnemy('mini', e.x+rand(-14,14), e.y+rand(-14,14), true);
      m.spawnT = 0.25;
    }
  }
  if (e.boss){
    game.bombs = Math.min(game.bombMax, game.bombs+1);
    popup(e.x, e.y-50, 'DREADNOUGHT DOWN', '#ff5ad2', true);
    game.hitStop = 0.22;
    addShake(CFG.shake.max*0.8);
    for (let i=0;i<3;i++) ring(e.x,e.y,'#fff',20+i*30,600+i*120,1.0,4);
    if (bossesAlive() === 0){
      UI.showBossBar(false);
      Music.intensity = 2;
    }
  }
  UI.dirtyScore = true;
}

function hurtPlayer(dmg, sx, sy){
  const p = game.player;
  if (p.iTime > 0 || game.over) return;
  if (p.shield > 0){
    p.shield = 0; p.shieldT = 0;
    p.iTime = 0.8;
    SFX.shieldBreak();
    ring(p.x, p.y, '#9fd8ff', p.r+6, 380, 0.5, 4);
    addShake(6);
    return;
  }
  p.hp -= dmg;
  p.iTime = CFG.player.iFrames;
  p.lastHurt = 0;
  game.streak = 0;
  if (game.mult > 1){ game.mult = 1; popup(p.x, p.y-30, 'MULTIPLIER LOST', '#ff5a5a'); }
  SFX.playerHit();
  addShake(CFG.shake.hit);
  game.hitStop = Math.max(game.hitStop, 0.05);
  burst(p.x, p.y, '#ff5a5a', 26, 380, 0.6, 4);
  ring(p.x, p.y, '#ff5a5a', 8, 420, 0.5, 4);
  if (sx!==undefined){ p.vx += sx; p.vy += sy; }
  UI.dirtyHp = true;
  if (p.hp <= 0){ p.hp = 0; startGameOver(); }
}

function startGameOver(){
  game.over = true;
  game.overTimer = 1.6;
  game.tsTarget = 0.25; game.timescale = 0.18;
  const p = game.player;
  burst(p.x, p.y, '#41f2ff', 90, 620, 1.2, 5);
  burst(p.x, p.y, '#fff', 40, 400, 1.0, 4);
  for (let i=0;i<4;i++) ring(p.x, p.y, i%2?'#41f2ff':'#fff', 10+i*20, 500+i*100, 1.1, 5);
  addShake(CFG.shake.max);
  SFX.gameOver();
  Music.intensity = 0;
}

/* ---------------- Bomb ---------------- */
function fireBomb(){
  if (game.bombs <= 0){ SFX.noBomb(); UI.flashBombBtn(); return; }
  if (game.over) return;
  game.bombs--;
  const p = game.player, B = CFG.bomb;
  SFX.bomb();
  addShake(B.shake);
  game.hitStop = 0.09;
  gridPulse = 1;
  for (let i=0;i<5;i++) ring(p.x, p.y, i%2?'#ffd24d':'#fff', 20+i*25, 900+i*160, 1.1, 6);
  burst(p.x, p.y, '#ffd24d', 70, 800, 1.0, 5);
  game.ebullets.length = 0; // vaporize enemy fire
  const list = game.enemies.slice();
  for (const e of list){
    const d = Math.hypot(e.x-p.x, e.y-p.y);
    if (d < B.radius){
      const fall = 1 - d/B.radius*0.6;
      damageEnemy(e, B.dmg*fall, (e.x-p.x)/d*400, (e.y-p.y)/d*400);
    }
  }
  UI.dirtyBombs = true;
}

/* ---------------- Player update ---------------- */
function playerUpdate(dt){
  const p = game.player, s = p.stats, P = CFG.player;
  // movement
  p.vx += Input.move.x * P.accel * dt;
  p.vy += Input.move.y * P.accel * dt;
  const f = 1 - Math.min(1, P.friction*dt);
  p.vx *= f; p.vy *= f;
  const vmax = s.speed;
  const vl = Math.hypot(p.vx, p.vy);
  if (vl > vmax){ p.vx = p.vx/vl*vmax; p.vy = p.vy/vl*vmax; }
  p.x += p.vx*dt; p.y += p.vy*dt;
  const A = CFG.arena/2 - p.r;
  if (p.x < -A){ p.x=-A; p.vx = Math.abs(p.vx)*0.4; }
  if (p.x >  A){ p.x= A; p.vx = -Math.abs(p.vx)*0.4; }
  if (p.y < -A){ p.y=-A; p.vy = Math.abs(p.vy)*0.4; }
  if (p.y >  A){ p.y= A; p.vy = -Math.abs(p.vy)*0.4; }

  // facing
  let aim = null;
  if (Input.aim.active){ aim = Math.atan2(Input.aim.y, Input.aim.x); }
  else if (Save.data.settings.autofire){
    // auto-aim at nearest enemy when not aiming manually
    let best = null, bd = 620*620;
    for (const e of game.enemies){
      if (!targetable(e)) continue;
      const d2 = dist2(p.x,p.y,e.x,e.y);
      if (d2 < bd){ bd = d2; best = e; }
    }
    if (best) aim = Math.atan2(best.y-p.y, best.x-p.x);
  }
  if (aim !== null) p.angle = angLerp(p.angle, aim, Math.min(1, 22*dt));
  else if (vl > 40) p.angle = angLerp(p.angle, Math.atan2(p.vy,p.vx), Math.min(1, 8*dt));

  // firing (overdrive: streak feeds fire rate)
  p.fireCd -= dt;
  const odMul = s.overdrive > 0 ? 1 + Math.min(game.streak,30)*0.01*s.overdrive : 1;
  const shotCd = 1/(s.fireRate*odMul);
  const wantFire = Input.firing || (Save.data.settings.autofire && aim !== null && !Input.aim.active);
  if (wantFire && p.fireCd <= 0 && aim !== null){
    p.fireCd = shotCd;
    fireVolley(p, s);
  } else if (wantFire && p.fireCd <= 0 && aim === null && Input.firing){
    p.fireCd = shotCd;
    fireVolley(p, s); // fire straight ahead
  }

  // static field aura
  if (s.auraLvl > 0 && !game.over){
    p.auraT = (p.auraT||0) - dt;
    if (p.auraT <= 0){
      p.auraT = 0.25;
      const R = s.auraR, tick = s.dmg*0.35*s.auraLvl*0.25;
      for (const e of game.enemies.slice()){
        if (!targetable(e)) continue;
        if (dist2(p.x,p.y,e.x,e.y) < R*R){
          damageEnemy(e, tick, 0, 0);
          if (Math.random() < 0.35)
            spawnP({x:e.x,y:e.y,vx:rand(-40,40),vy:rand(-40,40),life:0.25,maxLife:0.25,size:3,color:'#7affd8',drag:2,ring:false});
        }
      }
    }
  }

  // i-frames / regen / shield
  p.iTime = Math.max(0, p.iTime-dt);
  p.lastHurt += dt;
  if (p.lastHurt > P.regenDelay && p.hp < p.maxHp && !game.over){
    p.hp = Math.min(p.maxHp, p.hp + P.regenRate*dt);
    UI.dirtyHp = true;
  }
  if (p.shieldMax > 0 && p.shield < p.shieldMax){
    p.shieldT += dt;
    if (p.shieldT >= s.shieldCd){
      p.shield = p.shieldMax; p.shieldT = 0;
      ring(p.x,p.y,'#9fd8ff',p.r,200,0.5,3);
      SFX.heal();
      UI.dirtyHp = true;
    }
  }

  // engine trail
  p.trailT -= dt;
  if (p.trailT <= 0 && vl > 60){
    p.trailT = 0.02;
    const back = Math.atan2(p.vy,p.vx)+Math.PI;
    spawnP({ x:p.x+Math.cos(back)*p.r*0.9, y:p.y+Math.sin(back)*p.r*0.9,
      vx:Math.cos(back)*rand(40,120)+rand(-30,30), vy:Math.sin(back)*rand(40,120)+rand(-30,30),
      life:rand(0.2,0.4), maxLife:0.4, size:rand(2,4), color:'#41f2ff', drag:3, ring:false });
  }
}

function fireVolley(p, s){
  const n = s.shots;
  const spread = 0.14;
  for (let i=0;i<n;i++){
    const off = (i - (n-1)/2) * spread;
    const a = p.angle + off + rand(-0.012,0.012);
    game.bullets.push({
      x: p.x + Math.cos(a)*(p.r+6), y: p.y + Math.sin(a)*(p.r+6),
      vx: Math.cos(a)*s.bulletSpeed, vy: Math.sin(a)*s.bulletSpeed,
      life: s.range / s.bulletSpeed, dmg: s.dmg, pierce: s.pierce,
      homing: s.homing, ricochet: s.ricochet, r: CFG.bullet.r, hitSet: null, drone:false,
    });
  }
  // muzzle flash + recoil
  spawnP({ x:p.x+Math.cos(p.angle)*(p.r+8), y:p.y+Math.sin(p.angle)*(p.r+8),
    vx:Math.cos(p.angle)*80, vy:Math.sin(p.angle)*80,
    life:0.08, maxLife:0.08, size:9, color:'#eaffff', drag:2, ring:false });
  p.vx -= Math.cos(p.angle)*9; p.vy -= Math.sin(p.angle)*9;
  SFX.shoot();
}

/* ---------------- Drones ---------------- */
function updateDrones(dt){
  const p = game.player, D = CFG.drone, s = p.stats;
  const n = game.drones.length;
  for (let i=0;i<n;i++){
    const d = game.drones[i];
    const a = game.time*D.orbitSpeed + i*TAU/n;
    d.x = p.x + Math.cos(a)*D.orbitR;
    d.y = p.y + Math.sin(a)*D.orbitR;
    d.cd -= dt;
    if (d.cd <= 0){
      let best=null, bd=D.range*D.range;
      for (const e of game.enemies){
        if (!targetable(e)) continue;
        const q = dist2(d.x,d.y,e.x,e.y);
        if (q<bd){ bd=q; best=e; }
      }
      if (best){
        d.cd = D.fireCd;
        const aa = Math.atan2(best.y-d.y, best.x-d.x);
        game.bullets.push({
          x:d.x, y:d.y, vx:Math.cos(aa)*s.bulletSpeed*0.9, vy:Math.sin(aa)*s.bulletSpeed*0.9,
          life:0.8, dmg:s.dmg*D.dmgMul, pierce:0, homing:1, ricochet:0, r:4, hitSet:null, drone:true,
        });
        SFX.droneShoot();
      }
    }
  }
}

/* ---------------- Bullets, gems, collisions ---------------- */
function updateBullets(dt){
  const bs = game.bullets, es = game.enemies;
  for (let i=bs.length-1;i>=0;i--){
    const b = bs[i];
    b.life -= dt;
    if (b.life <= 0){ bs[i]=bs[bs.length-1]; bs.pop(); continue; }
    if (b.homing > 0){
      let best=null, bd=340*340;
      for (const e of es){
        if (!targetable(e) || (b.hitSet && b.hitSet.has(e))) continue;
        const q = dist2(b.x,b.y,e.x,e.y);
        if (q<bd){ bd=q; best=e; }
      }
      if (best){
        const cur = Math.atan2(b.vy,b.vx);
        const want = Math.atan2(best.y-b.y, best.x-b.x);
        const na = angLerp(cur, want, Math.min(1, (2.2+b.homing*2.2)*dt));
        const sp = Math.hypot(b.vx,b.vy);
        b.vx = Math.cos(na)*sp; b.vy = Math.sin(na)*sp;
      }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    const A = CFG.arena/2;
    if (b.x<-A||b.x>A||b.y<-A||b.y>A){ bs[i]=bs[bs.length-1]; bs.pop(); continue; }
    // vs enemies
    let dead = false;
    for (const e of es){
      if (!targetable(e)) continue;
      const rr = e.r + b.r;
      if (Math.abs(e.x-b.x)>rr || Math.abs(e.y-b.y)>rr) continue;
      if (dist2(e.x,e.y,b.x,b.y) > rr*rr) continue;
      if (b.hitSet && b.hitSet.has(e)) continue;
      const kb = CFG.bullet.knock;
      const sp0 = Math.hypot(b.vx,b.vy)||1;
      const pst = game.player ? game.player.stats : null;
      let dmg = b.dmg;
      if (!b.drone && pst && pst.critChance > 0 && Math.random() < pst.critChance){
        dmg *= 3;
        popup(e.x, e.y-14, 'CRIT', '#ffd24d');
      }
      damageEnemy(e, dmg, b.vx/sp0*kb, b.vy/sp0*kb);
      burst(b.x, b.y, e.color, 4, 200, 0.3, 2.5);
      (b.hitSet || (b.hitSet = new Set())).add(e);
      if (b.pierce > 0){ b.pierce--; }
      else if (b.ricochet > 0){
        b.ricochet--;
        let best=null, bd2=300*300;
        for (const o of es){
          if (!targetable(o) || b.hitSet.has(o)) continue;
          const q = dist2(b.x,b.y,o.x,o.y);
          if (q<bd2){ bd2=q; best=o; }
        }
        if (best){
          const na = Math.atan2(best.y-b.y, best.x-b.x);
          b.vx = Math.cos(na)*sp0; b.vy = Math.sin(na)*sp0;
          b.life = Math.max(b.life, 0.45);
          spawnP({x:b.x,y:b.y,vx:0,vy:0,life:0.15,maxLife:0.15,size:6,color:'#4d9fff',drag:0,ring:false});
        } else dead = true;
      }
      else dead = true;
      if (dead && !b.drone && pst && pst.blast > 0){
        const R = pst.blastR;
        burst(b.x, b.y, '#ff9a5a', 10, 300, 0.4, 3);
        ring(b.x, b.y, '#ff9a5a', 8, 340, 0.35, 3);
        for (const o of es.slice()){
          if (o===e || !targetable(o)) continue;
          if (dist2(b.x,b.y,o.x,o.y) < R*R) damageEnemy(o, b.dmg*0.5, 0, 0);
        }
      }
      break;
    }
    if (dead){ bs[i]=bs[bs.length-1]; bs.pop(); }
  }
}

function updateEBullets(dt){
  const p = game.player, ebs = game.ebullets;
  for (let i=ebs.length-1;i>=0;i--){
    const b = ebs[i];
    b.life -= dt;
    b.x += b.vx*dt; b.y += b.vy*dt;
    const A = CFG.arena/2;
    if (b.life<=0 || b.x<-A||b.x>A||b.y<-A||b.y>A){ ebs[i]=ebs[ebs.length-1]; ebs.pop(); continue; }
    const rr = b.r + p.r*0.8;
    if (!game.over && dist2(b.x,b.y,p.x,p.y) < rr*rr){
      ebs[i]=ebs[ebs.length-1]; ebs.pop();
      hurtPlayer(CFG.ebullet.dmg, b.vx*0.3, b.vy*0.3);
    }
  }
}

function updatePickups(dt){
  const p = game.player, s = p.stats;
  const gs = game.gems;
  for (let i=gs.length-1;i>=0;i--){
    const g = gs[i];
    g.life -= dt;
    if (g.life <= 0){ gs[i]=gs[gs.length-1]; gs.pop(); continue; }
    const dx = p.x-g.x, dy = p.y-g.y, d2v = dx*dx+dy*dy;
    const mr = s.magnetR;
    if (d2v < mr*mr){
      const d = Math.sqrt(d2v)||1;
      const pull = CFG.gem.pullAccel * (1.3 - d/mr);
      g.vx += dx/d*pull*dt; g.vy += dy/d*pull*dt;
      const vl = Math.hypot(g.vx,g.vy);
      if (vl > CFG.gem.maxPull){ g.vx=g.vx/vl*CFG.gem.maxPull; g.vy=g.vy/vl*CFG.gem.maxPull; }
    } else { g.vx *= (1-3*dt); g.vy *= (1-3*dt); }
    g.x += g.vx*dt; g.y += g.vy*dt;
    const rr = CFG.gem.r + p.r;
    if (d2v < rr*rr){
      gs[i]=gs[gs.length-1]; gs.pop();
      gainXp(1);
    }
  }
  const hs = game.hearts;
  for (let i=hs.length-1;i>=0;i--){
    const h = hs[i];
    h.life -= dt;
    h.vx *= (1-2*dt); h.vy *= (1-2*dt);
    h.x += h.vx*dt; h.y += h.vy*dt;
    if (h.life <= 0){ hs[i]=hs[hs.length-1]; hs.pop(); continue; }
    const rr = CFG.heart.r + p.r + 6;
    if (dist2(h.x,h.y,p.x,p.y) < rr*rr){
      hs[i]=hs[hs.length-1]; hs.pop();
      if (h.kind === 'bomb'){
        game.bombs = Math.min(game.bombMax, game.bombs+1);
        popup(p.x, p.y-26, '+1 NOVA', '#ffd24d');
        SFX.heal();
        ring(p.x,p.y,'#ffd24d',p.r,240,0.5,3);
        UI.dirtyBombs = true;
      } else {
        p.hp = Math.min(p.maxHp, p.hp + CFG.heart.heal);
        popup(p.x, p.y-26, '+'+CFG.heart.heal+' HULL', '#5aff8a');
        SFX.heal();
        ring(p.x,p.y,'#5aff8a',p.r,240,0.5,3);
        UI.dirtyHp = true;
      }
    }
  }
}

function gainXp(n){
  game.xp += n;
  SFX.pickup(game.xp);
  UI.dirtyXp = true;
  while (game.xp >= game.xpNext){
    game.xp -= game.xpNext;
    game.level++;
    game.xpNext = CFG.xp(game.level);
    game.levelupsQueued++;
  }
}

function playerVsEnemies(){
  const p = game.player;
  if (game.over) return;
  for (const e of game.enemies){
    if (!targetable(e)) continue;
    const rr = e.r + p.r*0.85;
    if (Math.abs(e.x-p.x)>rr || Math.abs(e.y-p.y)>rr) continue;
    if (dist2(e.x,e.y,p.x,p.y) < rr*rr){
      const d = Math.hypot(p.x-e.x, p.y-e.y)||1;
      hurtPlayer(e.dmg, (p.x-e.x)/d*320, (p.y-e.y)/d*320);
      if (!e.boss){ e.vx -= (p.x-e.x)/d*180; e.vy -= (p.y-e.y)/d*180; }
    }
  }
}

/* ---------------- Entity rendering ---------------- */
function poly(x,y,r,sides,rot){
  ctx.beginPath();
  for (let i=0;i<sides;i++){
    const a = rot + i/sides*TAU;
    const px = x+Math.cos(a)*r, py = y+Math.sin(a)*r;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}

const ENEMY_SIDES = { chaser:3, mini:3, weaver:4, drifter:4, splitter:6, shooter:5, tank:8,
  charger:3, sniper:3, healer:6, spinner:4, phantom:6 };

function drawEnemy(e){
  const s = worldToScreen(e.x,e.y);
  const r = e.r*VIEW_SCALE;
  if (s.x<-r*3||s.x>W+r*3||s.y<-r*3||s.y>H+r*3) return;
  const mat = e.spawnT>0 ? 1-clamp(e.spawnT/0.75,0,1) : 1;
  const vis = e.type==='phantom' ? (e.phased ? 0.16 : 0.72+0.28*Math.sin(performance.now()/180)) : 1;
  ctx.globalAlpha = (0.35+0.65*mat)*vis;
  const rr = r*(0.5+0.5*mat);

  ctx.globalCompositeOperation='lighter';
  drawGlow(s.x, s.y, rr*(e.boss?3.4:2.6), e.color, 0.33*mat*vis);
  ctx.globalCompositeOperation='source-over';

  if (e.boss){ drawBoss(e, s, rr); ctx.globalAlpha=1; return; }
  let rot = e.ang;
  if (e.type==='chaser'||e.type==='mini') rot = Math.atan2(e.vy,e.vx);
  if (e.type==='charger') rot = (e.dashT>0||e.telT>0) ? e.aimAng : Math.atan2(e.vy,e.vx);
  if (e.type==='sniper') rot = e.telT>0 ? e.aimAng : Math.atan2(e.vy,e.vx);
  if (e.type==='weaver') rot += Math.PI/4;

  // sniper telegraph laser
  if (e.type==='sniper' && e.telT>0){
    const ex = worldToScreen(e.x+Math.cos(e.aimAng)*1300, e.y+Math.sin(e.aimAng)*1300);
    ctx.save();
    ctx.globalAlpha = clamp(1-e.telT, 0.15, 0.75)*0.55;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = Math.max(1, 1.4*VIEW_SCALE);
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(ex.x,ex.y); ctx.stroke();
    ctx.restore();
  }

  const flash = e.hitT>0 || (e.type==='charger' && e.telT>0 && Math.sin(performance.now()/55)>0);
  if (e.type==='orbiter'){ ctx.beginPath(); ctx.arc(s.x,s.y,rr,0,TAU); }
  else poly(s.x, s.y, rr, ENEMY_SIDES[e.type]||4, rot);
  ctx.fillStyle = flash ? '#ffffff' : 'rgba(8,10,24,0.9)';
  ctx.fill();
  ctx.strokeStyle = flash ? '#ffffff' : e.color;
  ctx.lineWidth = Math.max(1.5, 2.2*VIEW_SCALE);
  ctx.stroke();
  if (e.type==='tank'){
    poly(s.x, s.y, rr*0.55, 8, -e.ang*1.4);
    ctx.stroke();
  }
  if (e.type==='shooter'){
    ctx.beginPath(); ctx.arc(s.x,s.y,rr*0.3,0,TAU); ctx.stroke();
  }
  if (e.type==='orbiter'){
    poly(s.x, s.y, rr*0.52, 3, e.ang*2.2);
    ctx.stroke();
  }
  if (e.type==='spinner'){
    poly(s.x, s.y, rr*0.62, 4, -e.ang*1.6);
    ctx.stroke();
  }
  if (e.type==='healer'){
    ctx.fillStyle = flash ? '#fff' : e.color;
    const w = rr*0.22, l = rr*0.55;
    ctx.fillRect(s.x-w/2, s.y-l, w, l*2);
    ctx.fillRect(s.x-l, s.y-w/2, l*2, w);
  }
  ctx.globalAlpha = 1;
}

function drawBoss(e, s, rr){
  const frac = e.hp/e.maxHp;
  const core = frac>0.66?'#ff5ad2':frac>0.33?'#ffb84d':'#ff5a5a';
  poly(s.x, s.y, rr, 10, e.ang);
  ctx.fillStyle = e.hitT>0?'#fff':'rgba(20,6,20,0.92)';
  ctx.fill();
  ctx.strokeStyle = e.hitT>0?'#fff':e.color;
  ctx.lineWidth = 3*VIEW_SCALE;
  ctx.stroke();
  poly(s.x, s.y, rr*0.72, 10, -e.ang*1.3);
  ctx.strokeStyle = e.hitT>0?'#fff':core;
  ctx.lineWidth = 2*VIEW_SCALE;
  ctx.stroke();
  const pulse = 0.75+0.25*Math.sin(performance.now()/120);
  ctx.beginPath(); ctx.arc(s.x,s.y,rr*0.34*pulse,0,TAU);
  ctx.fillStyle = core; ctx.fill();
  // telegraph for dash
  if (e.attack==='dash' && e.attackPhase===0){
    ctx.globalAlpha = 0.5+0.5*Math.sin(performance.now()/60);
    ctx.strokeStyle = '#ffd24d';
    ctx.lineWidth = 2*VIEW_SCALE;
    const p = worldToScreen(game.player.x, game.player.y);
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawShip(){
  const p = game.player;
  if (game.over) return;
  const s = worldToScreen(p.x,p.y);
  const r = p.r*VIEW_SCALE;
  if (p.iTime>0 && Math.sin(performance.now()/40)>0.2) ctx.globalAlpha = 0.35;

  ctx.globalCompositeOperation='lighter';
  drawGlow(s.x,s.y,r*3,'#41f2ff',0.4);
  ctx.globalCompositeOperation='source-over';

  if (p.stats.auraLvl > 0){
    const R = p.stats.auraR*VIEW_SCALE;
    const a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0*(0.12 + 0.05*Math.sin(performance.now()/300));
    ctx.beginPath(); ctx.arc(s.x,s.y,R,0,TAU);
    ctx.strokeStyle = '#7affd8';
    ctx.lineWidth = 2*VIEW_SCALE;
    ctx.stroke();
    ctx.globalAlpha = a0*0.05;
    ctx.fillStyle = '#7affd8';
    ctx.fill();
    ctx.globalAlpha = a0;
  }

  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(p.angle);
  ctx.beginPath();
  ctx.moveTo(r*1.25,0);
  ctx.lineTo(-r*0.85, r*0.8);
  ctx.lineTo(-r*0.4, 0);
  ctx.lineTo(-r*0.85,-r*0.8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(8,16,34,0.95)';
  ctx.fill();
  ctx.strokeStyle = '#41f2ff';
  ctx.lineWidth = Math.max(1.5, 2.2*VIEW_SCALE);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(r*0.25,0,r*0.28,0,TAU);
  ctx.fillStyle = '#eaffff';
  ctx.fill();
  ctx.restore();

  if (p.shield>0){
    ctx.beginPath();
    ctx.arc(s.x,s.y,r+6*VIEW_SCALE,0,TAU);
    ctx.strokeStyle = 'rgba(159,216,255,'+(0.5+0.3*Math.sin(performance.now()/200))+')';
    ctx.lineWidth = 2*VIEW_SCALE;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawDrones(){
  for (const d of game.drones){
    if (d.x===undefined) continue;
    const s = worldToScreen(d.x,d.y);
    const r = 6*VIEW_SCALE;
    ctx.globalCompositeOperation='lighter';
    drawGlow(s.x,s.y,r*2.6,'#41f2ff',0.3);
    ctx.globalCompositeOperation='source-over';
    poly(s.x,s.y,r,3,game.time*4);
    ctx.fillStyle='rgba(8,16,34,0.95)'; ctx.fill();
    ctx.strokeStyle='#9fd8ff'; ctx.lineWidth=Math.max(1,1.5*VIEW_SCALE); ctx.stroke();
  }
}

function drawBullets(){
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for (const b of game.bullets){
    const s = worldToScreen(b.x,b.y);
    if (s.x<-30||s.x>W+30||s.y<-30||s.y>H+30) continue;
    const tx = s.x - b.vx*0.014*VIEW_SCALE, ty = s.y - b.vy*0.014*VIEW_SCALE;
    ctx.strokeStyle = b.drone ? '#9fd8ff' : '#bffcff';
    ctx.lineWidth = (b.drone?2.2:3.2)*VIEW_SCALE;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(s.x,s.y); ctx.stroke();
    drawGlow(s.x,s.y,9*VIEW_SCALE,'#41f2ff',0.45);
  }
  const pul = 0.8+0.2*Math.sin(performance.now()/90);
  for (const b of game.ebullets){
    const s = worldToScreen(b.x,b.y);
    if (s.x<-30||s.x>W+30||s.y<-30||s.y>H+30) continue;
    drawGlow(s.x,s.y,13*VIEW_SCALE*pul,'#ff5ad2',0.6);
    ctx.beginPath(); ctx.arc(s.x,s.y,b.r*VIEW_SCALE*0.75,0,TAU);
    ctx.fillStyle='#ffd6f5'; ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

function drawPickups(){
  ctx.globalCompositeOperation='lighter';
  const rot = performance.now()/300;
  for (const g of game.gems){
    const s = worldToScreen(g.x,g.y);
    if (s.x<-20||s.x>W+20||s.y<-20||s.y>H+20) continue;
    const blink = g.life<3 ? (Math.sin(performance.now()/90)>0?1:0.25) : 1;
    ctx.globalAlpha = blink;
    drawGlow(s.x,s.y,10*VIEW_SCALE,'#7dffca',0.4*blink);
    poly(s.x,s.y,CFG.gem.r*VIEW_SCALE,4,rot);
    ctx.fillStyle='#7dffca'; ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  for (const h of game.hearts){
    const s = worldToScreen(h.x,h.y);
    const r = CFG.heart.r*VIEW_SCALE;
    const bob = Math.sin(performance.now()/250)*2*VIEW_SCALE;
    const col = h.kind==='bomb' ? '#ffd24d' : '#5aff8a';
    ctx.globalCompositeOperation='lighter';
    drawGlow(s.x,s.y+bob,r*2.4,col,0.4);
    ctx.globalCompositeOperation='source-over';
    ctx.beginPath(); ctx.arc(s.x,s.y+bob,r,0,TAU);
    ctx.fillStyle = h.kind==='bomb' ? 'rgba(24,18,4,0.9)' : 'rgba(6,20,10,0.9)';
    ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,2*VIEW_SCALE); ctx.stroke();
    if (h.kind==='bomb'){
      poly(s.x, s.y+bob, r*0.55, 4, performance.now()/400);
      ctx.fillStyle=col; ctx.fill();
    } else {
      ctx.fillStyle=col;
      const w=r*0.3, l=r*0.62;
      ctx.fillRect(s.x-w/2, s.y+bob-l, w, l*2);
      ctx.fillRect(s.x-l, s.y+bob-w/2, l*2, w);
    }
  }
}

function drawSticks(){
  if (Input.lastType!=='touch') return;
  const R = CFG.stick.radius;
  for (const k of ['move','aim']){
    const st = Input.sticks[k];
    if (st.id===null) continue;
    ctx.globalAlpha = 0.22;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, R, 0, TAU);
    ctx.strokeStyle = k==='move' ? '#41f2ff' : '#ff5ad2';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(st.ox+st.dx*R, st.oy+st.dy*R, R*0.42, 0, TAU);
    ctx.fillStyle = k==='move' ? 'rgba(65,242,255,0.5)' : 'rgba(255,90,210,0.5)';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

const Tune = {
  defaults:{}, ret:'menu',
  get(k){ const p=k.split('.'); let o=CFG; for (let i=0;i<p.length-1;i++) o=o[p[i]]; return o[p[p.length-1]]; },
  set(k,v){ const p=k.split('.'); let o=CFG; for (let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=v; },
  init(){
    for (const f of TUNE_FIELDS) this.defaults[f.k] = this.get(f.k);
    try {
      const stored = JSON.parse(localStorage.getItem(TUNE_KEY) || 'null');
      if (stored && typeof stored === 'object') this.applyObj(stored, false);
    } catch(e) { /* bad stored tune — ignore */ }
    this.buildUI();
    $('btn-tune').addEventListener('click', ()=>{ SFX.ui(); this.open('menu'); });
    $('btn-tune2').addEventListener('click', ()=>{ SFX.ui(); this.open('paused'); });
    $('btn-tune-close').addEventListener('click', ()=>{ SFX.ui(); this.close(); });
    $('btn-tune-copy').addEventListener('click', ()=>this.copy());
    $('btn-tune-apply').addEventListener('click', ()=>this.applyJson());
    $('btn-tune-reset').addEventListener('click', ()=>{
      this.applyObj(this.defaults, true); this.persist(); SFX.ui();
    });
  },
  applyObj(obj, updateUI){
    for (const f of TUNE_FIELDS){
      if (obj[f.k] === undefined) continue;
      const v = +obj[f.k];
      if (!Number.isFinite(v)) continue;
      this.set(f.k, clamp(v, f.min, f.max));
    }
    if (game.player) recomputeStats();
    if (updateUI) this.refreshUI();
  },
  currentObj(){ const o={}; for (const f of TUNE_FIELDS) o[f.k]=this.get(f.k); return o; },
  isDefault(){ return TUNE_FIELDS.every(f => this.get(f.k) === this.defaults[f.k]); },
  persist(){
    try {
      if (this.isDefault()) localStorage.removeItem(TUNE_KEY);
      else localStorage.setItem(TUNE_KEY, JSON.stringify(this.currentObj()));
    } catch(e){}
    this.refreshJson();
  },
  fmt(f){
    const v = this.get(f.k);
    return f.step >= 1 ? String(Math.round(v)) : v.toFixed(f.step < 0.01 ? 3 : 2);
  },
  buildUI(){
    const list = $('tune-list');
    let group = '';
    for (const f of TUNE_FIELDS){
      if (f.g && f.g !== group){
        group = f.g;
        const h = document.createElement('div');
        h.className = 'tgroup'; h.textContent = group;
        list.appendChild(h);
      }
      const row = document.createElement('div'); row.className='trow';
      const lb = document.createElement('label'); lb.textContent = f.l;
      const inp = document.createElement('input');
      inp.type='range'; inp.min=f.min; inp.max=f.max; inp.step=f.step; inp.value=this.get(f.k);
      const val = document.createElement('div'); val.className='tval'; val.textContent=this.fmt(f);
      inp.addEventListener('input', ()=>{
        this.set(f.k, +inp.value);
        val.textContent = this.fmt(f);
        if (game.player) recomputeStats();
        this.persist();
      });
      f._inp = inp; f._val = val;
      row.append(lb, inp, val);
      list.appendChild(row);
    }
    this.refreshJson();
  },
  refreshUI(){
    for (const f of TUNE_FIELDS){
      if (f._inp){ f._inp.value = this.get(f.k); f._val.textContent = this.fmt(f); }
    }
    this.refreshJson();
  },
  refreshJson(){ $('tune-json').value = JSON.stringify(this.currentObj(), null, 1); },
  copy(){
    this.refreshJson();
    const ta = $('tune-json');
    const done = ()=>{
      const b = $('btn-tune-copy');
      b.textContent = 'COPIED ✓';
      setTimeout(()=>b.textContent = 'Copy JSON', 1000);
    };
    const fallback = ()=>{ try { ta.select(); document.execCommand('copy'); } catch(e){} done(); };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(ta.value).then(done, fallback);
    else fallback();
    SFX.ui();
  },
  applyJson(){
    try {
      const o = JSON.parse($('tune-json').value);
      this.applyObj(o, true);
      this.persist();
      SFX.ui();
    } catch(e){
      const b = $('btn-tune-apply');
      b.textContent = 'BAD JSON ✗';
      setTimeout(()=>b.textContent = 'Apply JSON', 1200);
    }
  },
  open(ret){ this.ret = ret; state = 'tune'; this.refreshUI(); UI.show('screen-tune'); },
  close(){
    this.persist();
    state = this.ret;
    UI.show(this.ret === 'paused' ? 'screen-pause' : 'screen-menu');
  },
};

/* ---------------- Upgrade application ---------------- */
function chooseUpgrade(i){
  const u = UI.cards[i];
  if (!u) return;
  SFX.choose();
  const p = game.player;
  if (u.id === 'repair'){
    p.hp = Math.min(p.maxHp, p.hp+40);
    game.bombs = Math.min(game.bombMax, game.bombs+1);
  } else {
    game.up[u.id] = (game.up[u.id]||0)+1;
    recomputeStats();
    if (u.id==='hull') p.hp = Math.min(p.maxHp, p.hp+30);
    if (u.id==='bomb') game.bombs = Math.min(game.bombMax, game.bombs+1);
    if (u.id==='shield') p.shield = p.shieldMax;
  }
  UI.dirtyHp = UI.dirtyBombs = true;
  ring(p.x,p.y,'#ffd24d',p.r,320,0.6,4);
  burst(p.x,p.y,'#ffd24d',24,300,0.6,3);
  game.levelupsQueued--;
  if (game.levelupsQueued > 0) UI.openLevelUp();
  else { state = 'playing'; UI.show(null); }
}

/* ---------------- State transitions ---------------- */
function startRun(){
  AudioSys.unlock();
  newGame();
  state = 'playing';
  UI.show(null);
  UI.dirtyScore = UI.dirtyHp = UI.dirtyXp = UI.dirtyBombs = true;
  Music.mode = 'game';
  hintTimer = 7;
  UI.el.hint.style.opacity = '1';
  UI.refreshHints();
}
function toMenu(){
  state = 'menu';
  AudioSys.resume(); // in case we arrived here from the pause screen
  UI.show('screen-menu');
  UI.showBossBar(false);
  Music.mode = 'menu';
  Music.intensity = 0;
  $('menu-best').textContent = Save.data.best.score > 0
    ? 'BEST  '+fmt(Save.data.best.score)+'  ·  WAVE '+Save.data.best.wave : 'FIRST FLIGHT — GOOD LUCK, PILOT';
}
function pauseGame(){
  if (state!=='playing') return;
  state = 'paused';
  UI.show('screen-pause');
  AudioSys.suspend();
}
function resumeGame(){
  if (state!=='paused') return;
  state = 'playing';
  UI.show(null);
  AudioSys.resume();
}
function finishGameOver(){
  state = 'over';
  const b = Save.data.best;
  const isBest = game.score > b.score;
  if (isBest){ b.score = game.score; b.wave = game.wave; b.kills = game.kills; }
  Save.write();
  $('newbest').classList.toggle('hidden', !isBest);
  $('over-stats').innerHTML =
    '<div class="k">WAVE REACHED</div><div class="v">'+game.wave+'</div>'
    +'<div class="k">ENEMIES DOWN</div><div class="v">'+fmt(game.kills)+'</div>'
    +'<div class="k">TIME SURVIVED</div><div class="v">'+fmtTime(game.time)+'</div>'
    +'<div class="k">MAX MULTIPLIER</div><div class="v">×'+game.maxMult+'</div>'
    +'<div class="k">BEST SCORE</div><div class="v">'+fmt(b.score)+'</div>';
  UI.show('screen-over');
  // count-up animation for final score
  const el = $('final-score'), target = game.score, t0 = performance.now();
  (function tick(){
    if (state!=='over') return;
    const k = Math.min(1,(performance.now()-t0)/900);
    el.textContent = fmt(Math.round(target*(1-Math.pow(1-k,3))));
    if (k<1) requestAnimationFrame(tick);
  })();
}

/* ---------------- Main loop ---------------- */
let hintTimer = 0;
let frameMs = 16, perfBad = 0, quality = 2; // 2=full 1=reduced 0=minimal

function updatePlaying(step){
  // hit-stop eats real time
  if (game.hitStop > 0){ game.hitStop -= step; return; }
  game.timescale = lerp(game.timescale, game.tsTarget, 0.08);
  const dt = step * game.timescale;
  game.time += dt;

  if (!game.over){
    playerUpdate(dt);
    updateDrones(dt);
  } else {
    game.overTimer -= step;
    if (game.overTimer <= 0){ finishGameOver(); return; }
  }
  for (const e of game.enemies) enemyUpdate(e, dt);
  separateEnemies(dt);
  // boss bar aggregates every living dreadnought
  {
    let bHp=0, bMax=0, bN=0;
    for (const e of game.enemies) if (e.boss){ bHp+=Math.max(0,e.hp); bMax+=e.maxHp; bN++; }
    if (bN>0){ UI.setBossHp(bHp/bMax); UI.setBossCount(bN); }
  }
  updateBullets(dt);
  updateEBullets(dt);
  updatePickups(dt);
  playerVsEnemies();
  trySpawnGroup(dt);
  checkWaveEnd(dt);
  updateParticles(dt);
  updatePopups(dt);

  if (hintTimer > 0){
    hintTimer -= step;
    if (hintTimer <= 0) UI.el.hint.style.opacity = '0';
  }
  gridPulse = Math.max(0, gridPulse - 1.6*dt);

  // camera: follow + aim lookahead
  const p = game.player;
  const look = 70;
  cam.tx = p.x + Math.cos(p.angle)*look*0.4 + p.vx*0.12;
  cam.ty = p.y + Math.sin(p.angle)*look*0.4 + p.vy*0.12;
  cam.x = lerp(cam.x, cam.tx, Math.min(1, 5*step));
  cam.y = lerp(cam.y, cam.ty, Math.min(1, 5*step));
  const vh = viewHalf(), A = CFG.arena/2;
  cam.x = clamp(cam.x, Math.min(0,-A+vh.w), Math.max(0,A-vh.w));
  cam.y = clamp(cam.y, Math.min(0,-A+vh.h), Math.max(0,A-vh.h));

  // trigger level-up screen between volleys
  if (game.levelupsQueued > 0 && !game.over){
    state = 'levelup';
    SFX.levelUp();
    UI.openLevelUp();
    UI.show('screen-levelup');
  }
}

function updateMenu(step){
  // attract mode: slow camera orbit + ambient sparkles
  const t = performance.now()/1000;
  cam.x = Math.cos(t*0.11)*380;
  cam.y = Math.sin(t*0.07)*380;
  if (Math.random()<0.06)
    burst(cam.x+rand(-500,500), cam.y+rand(-400,400), pick(['#41f2ff','#ff5ad2','#ffd24d','#5aff8a']), 5, 120, 1.2, 3);
  updateParticles(step);
  gridPulse = Math.max(0, gridPulse-step);
}

function fixedUpdate(step){
  const p = game.player;
  const ps = (state==='playing' && p) ? worldToScreen(p.x,p.y) : null;
  Input.poll(ps);

  // global input edges by state
  if (Input.pauseEdge){
    if (state==='playing') pauseGame();
    else if (state==='paused') resumeGame();
    else if (state==='tune') Tune.close();
  }
  if (state==='playing'){
    if (Input.bombEdge && !game.over) fireBomb();
    updatePlaying(step);
  } else if (state==='menu'){
    if (Input.confirmEdge){ SFX.ui(); startRun(); }
    updateMenu(step);
  } else if (state==='over'){
    if (Input.confirmEdge && game.overTimer<=-0.5){ SFX.ui(); startRun(); }
    game.overTimer -= step;
    updateParticles(step);
    updatePopups(step);
  } else if (state==='levelup'){
    if (Input.navEdge) UI.moveSel(Input.navEdge);
    if (Input.digitEdge) chooseUpgrade(Input.digitEdge-1);
    else if (Input.confirmEdge) chooseUpgrade(UI.selIdx);
  }

  // camera shake decay
  if (cam.shake > 0){
    cam.shake = Math.max(0, cam.shake - CFG.shake.decay*step);
    cam.sx = rand(-1,1)*cam.shake;
    cam.sy = rand(-1,1)*cam.shake;
  } else { cam.sx = cam.sy = 0; }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const t = performance.now()/1000;
  drawBackground(t);
  if (state!=='menu' && game.player){
    drawPickups();
    for (const e of game.enemies) drawEnemy(e);
    drawDrones();
    drawShip();
    drawBullets();
  }
  drawParticles();
  drawPopups();
  if (state==='playing') drawSticks();
  const p = game.player;
  const lowHp = (state==='playing'||state==='levelup') && p && !game.over && p.hp < p.maxHp*0.35
    ? 1 - p.hp/(p.maxHp*0.35) : 0;
  drawVignette(lowHp);
  if (state==='playing'||state==='levelup'||state==='paused') UI.updateHud();
}

/* adaptive quality: drop render scale + particle budget if frame time stays high */
function adaptQuality(ms){
  frameMs = frameMs*0.95 + ms*0.05;
  if (frameMs > 22 && quality > 0){
    perfBad += 1;
    if (perfBad > 180){
      perfBad = 0; quality--;
      particleBudget = quality===1 ? 520 : 300;
      renderScale = quality===1 ? 0.8 : 0.62;
      resize();
    }
  } else if (perfBad > 0) perfBad -= 2;
}

let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now-last)/1000;
  adaptQuality(now-last);
  last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let n = 0;
  while (acc >= CFG.step && n < CFG.maxSteps){ fixedUpdate(CFG.step); acc -= CFG.step; n++; }
  if (n === CFG.maxSteps) acc = 0;
  render();

  if (DEBUG){
    UI.el.debug.textContent =
      'fps '+(1000/Math.max(1,frameMs)).toFixed(0)
      +' | q'+quality+' scale '+renderScale
      +'\nen '+game.enemies.length+' pb '+game.bullets.length+' eb '+game.ebullets.length
      +' pt '+particles.length+' gem '+game.gems.length;
  }
}

/* ---------------- Boot ---------------- */
const DEBUG = /[?&]debug=1/.test(location.search);
if (DEBUG) $('debug').classList.remove('hidden');
if (DEBUG) addEventListener('keydown', e=>{
  if (e.code==='KeyG' && game.player){ game.player.hp = game.player.maxHp = 99999; }
  if (e.code==='KeyL'){ gainXp(game.xpNext); }
  if (e.code==='KeyK'){ game.enemies.slice().forEach(e2=>{ if(!e2.boss) killEnemy(e2); }); }
});

document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){
    if (state==='playing') pauseGame();
    else AudioSys.suspend();
  } else if (state!=='paused') AudioSys.resume();
});
// unlock audio on first interaction of any kind
const unlockOnce = ()=>{ AudioSys.unlock(); };
addEventListener('pointerdown', unlockOnce, {once:false});
addEventListener('keydown', unlockOnce, {once:false});
// keep buttons from re-triggering via Space/Enter after a click
addEventListener('click', e=>{
  if (e.target instanceof HTMLElement && typeof e.target.blur==='function') e.target.blur();
}, true);

resize();
Input.init();
UI.init();
Tune.init();
toMenu();
requestAnimationFrame(frame);
</script>
</body>
