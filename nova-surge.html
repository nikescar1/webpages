<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Nova Surge — a neon twin-stick arena shooter. Survive the swarm, upgrade your ship, beat your best.">
<title>NOVA SURGE</title>
<style>
:root{
  --cyan:#41f2ff; --magenta:#ff5ad2; --gold:#ffd24d; --red:#ff5a5a; --green:#5aff8a;
  --ink:#050510;
  --sat: env(safe-area-inset-top,0px);
  --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px);
  --sar: env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;color:#cfe9ff}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.hidden{display:none !important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0}
#xpbar{position:absolute;top:0;left:0;right:0;height:calc(4px + var(--sat)*0.0 + 0px);height:4px;margin-top:var(--sat);background:rgba(65,242,255,.12)}
#xpfill{height:100%;width:0%;background:linear-gradient(90deg,#1fb6d8,var(--cyan));box-shadow:0 0 8px var(--cyan);transition:width .15s ease-out}
#hud-top{position:absolute;top:calc(10px + var(--sat));left:calc(12px + var(--sal));right:calc(12px + var(--sar));
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#score-box{text-align:left;min-width:90px}
#score{font-size:clamp(20px,4.5vmin,30px);font-weight:800;letter-spacing:1px;color:#fff;
  text-shadow:0 0 12px rgba(65,242,255,.8);font-variant-numeric:tabular-nums;line-height:1}
#mult{font-size:clamp(12px,2.6vmin,16px);font-weight:700;color:var(--gold);text-shadow:0 0 8px rgba(255,210,77,.7);margin-top:2px}
#mult.hot{color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
#wave-box{font-size:clamp(13px,3vmin,18px);font-weight:800;letter-spacing:3px;color:#9fd8ff;opacity:.9;
  text-shadow:0 0 10px rgba(65,242,255,.5);padding-top:2px;text-align:center;flex:1}
#btn-pause{pointer-events:auto;width:clamp(38px,9vmin,46px);height:clamp(38px,9vmin,46px);border-radius:12px;
  border:2px solid rgba(65,242,255,.5);background:rgba(5,10,26,.55);color:var(--cyan);
  font-size:clamp(14px,3.4vmin,18px);font-weight:800;cursor:pointer;letter-spacing:1px;backdrop-filter:blur(4px)}
#btn-pause:active{background:rgba(65,242,255,.25)}

#bosshp{position:absolute;top:calc(56px + var(--sat));left:50%;transform:translateX(-50%);
  width:min(70vw,420px);height:12px;border:2px solid rgba(255,90,210,.7);border-radius:8px;
  background:rgba(20,4,20,.6);box-shadow:0 0 14px rgba(255,90,210,.45);overflow:hidden}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#b0186e,var(--magenta));transition:width .12s linear}
#bosslabel{position:absolute;top:-2px;left:0;right:0;transform:translateY(-100%);text-align:center;
  font-size:11px;font-weight:800;letter-spacing:4px;color:var(--magenta);text-shadow:0 0 8px rgba(255,90,210,.8)}

#hud-bottom{position:absolute;bottom:calc(12px + var(--sab));left:calc(14px + var(--sal));right:calc(14px + var(--sar));
  display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
#hp-wrap{display:flex;flex-direction:column;gap:5px}
#shieldpips{display:flex;gap:5px;height:8px}
.pip{width:26px;height:6px;border-radius:3px;background:rgba(159,216,255,.15);border:1px solid rgba(159,216,255,.35)}
.pip.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#hpbar{width:clamp(130px,34vmin,220px);height:12px;border:2px solid rgba(90,255,138,.55);border-radius:8px;
  background:rgba(4,18,10,.6);overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#1f9e4e,var(--green));transition:width .15s ease-out,background .3s}
#hpbar.low #hpfill{background:linear-gradient(90deg,#b02020,var(--red))}
#bombs{display:flex;align-items:center;gap:10px}
#bombicons{display:flex;gap:6px}
.bombdot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,210,77,.65);background:transparent}
.bombdot.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
#btn-bomb{pointer-events:auto;width:clamp(58px,15vmin,76px);height:clamp(58px,15vmin,76px);border-radius:50%;
  border:2px solid rgba(255,210,77,.7);background:radial-gradient(circle at 35% 30%,rgba(255,210,77,.28),rgba(30,20,4,.6));
  color:var(--gold);font-weight:900;font-size:clamp(11px,2.6vmin,14px);letter-spacing:2px;cursor:pointer;
  box-shadow:0 0 16px rgba(255,210,77,.25);backdrop-filter:blur(3px)}
#btn-bomb:active{transform:scale(.92)}
#btn-bomb.empty{opacity:.35;box-shadow:none}

#hint{position:absolute;bottom:calc(96px + var(--sab));left:0;right:0;text-align:center;
  font-size:clamp(12px,2.8vmin,15px);font-weight:600;letter-spacing:2px;color:rgba(159,216,255,.85);
  text-shadow:0 0 8px rgba(65,242,255,.4);transition:opacity 1s;pointer-events:none}
#banner{position:absolute;top:32%;left:0;right:0;text-align:center;pointer-events:none}
#banner .big{font-size:clamp(30px,9vmin,64px);font-weight:900;letter-spacing:8px;color:#fff;
  text-shadow:0 0 24px var(--cyan),0 0 60px rgba(65,242,255,.5)}
#banner .sub{font-size:clamp(13px,3.4vmin,20px);font-weight:700;letter-spacing:5px;color:var(--gold);margin-top:6px;
  text-shadow:0 0 12px rgba(255,210,77,.6)}
#banner.show{animation:bannerIn 2.6s ease-out forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.06)}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;pointer-events:auto;background:rgba(4,6,18,.72);backdrop-filter:blur(6px);
  padding:calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal));
  animation:fadeIn .35s ease-out;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.logo{font-size:clamp(40px,12vmin,84px);font-weight:900;font-style:italic;letter-spacing:6px;line-height:.95;text-align:center;
  background:linear-gradient(180deg,#fff 15%,var(--cyan) 55%,#1a6cff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(65,242,255,.55));transform:skewY(-2deg)}
.logo em{font-style:italic;background:linear-gradient(180deg,#fff 15%,var(--magenta) 60%,#a01aff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:clamp(12px,3vmin,16px);letter-spacing:6px;color:#9fd8ff;font-weight:700;margin-top:-4px;text-align:center}
.best{font-size:clamp(13px,3.2vmin,17px);color:var(--gold);font-weight:700;letter-spacing:2px;text-shadow:0 0 10px rgba(255,210,77,.5)}
.btn{pointer-events:auto;min-width:min(240px,70vw);padding:14px 34px;border-radius:14px;cursor:pointer;
  border:2px solid var(--cyan);background:rgba(10,24,44,.65);color:#eaffff;
  font-size:clamp(16px,4.2vmin,21px);font-weight:900;letter-spacing:4px;text-transform:uppercase;
  box-shadow:0 0 18px rgba(65,242,255,.25),inset 0 0 14px rgba(65,242,255,.08);transition:transform .08s,box-shadow .2s}
.btn:hover{box-shadow:0 0 26px rgba(65,242,255,.5),inset 0 0 20px rgba(65,242,255,.15)}
.btn:active{transform:scale(.95)}
.btn.primary{border-color:var(--gold);color:#fffbe8;box-shadow:0 0 22px rgba(255,210,77,.35),inset 0 0 14px rgba(255,210,77,.1);animation:breathe 2.2s infinite ease-in-out}
@keyframes breathe{0%,100%{box-shadow:0 0 14px rgba(255,210,77,.3)}50%{box-shadow:0 0 30px rgba(255,210,77,.55)}}
.btn.small{min-width:0;padding:9px 16px;font-size:clamp(11px,2.8vmin,14px);letter-spacing:2px;border-radius:10px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(480px,92vw)}
.controls-note{font-size:clamp(11px,2.6vmin,13px);letter-spacing:1.5px;color:rgba(159,216,255,.7);text-align:center;line-height:1.7;max-width:min(440px,88vw)}
h2.title{font-size:clamp(22px,6vmin,34px);font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 16px rgba(65,242,255,.6);text-align:center}
h2.title.gold{text-shadow:0 0 16px rgba(255,210,77,.7);color:#fff8e0}
h2.title.red{text-shadow:0 0 18px rgba(255,90,90,.8);color:#ffe8e8}

/* level-up cards */
#cards{display:flex;gap:12px;justify-content:center;align-items:stretch;flex-wrap:wrap;max-width:min(720px,94vw)}
.card{pointer-events:auto;flex:1 1 150px;max-width:210px;min-width:140px;padding:16px 12px;border-radius:16px;cursor:pointer;
  border:2px solid rgba(65,242,255,.45);background:linear-gradient(180deg,rgba(12,26,50,.9),rgba(6,10,26,.9));
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  transition:transform .12s,border-color .12s,box-shadow .12s;animation:cardIn .35s backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1}}
.card:hover,.card.sel{transform:translateY(-4px) scale(1.03);border-color:var(--gold);box-shadow:0 0 22px rgba(255,210,77,.35)}
.card .icon{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;border:2px solid currentColor;text-shadow:0 0 10px currentColor}
.card .cname{font-size:clamp(13px,3.2vmin,16px);font-weight:800;letter-spacing:1.5px;color:#fff}
.card .cdesc{font-size:clamp(11px,2.7vmin,13px);color:#9fd8ff;line-height:1.45}
.card .clvl{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:700}
.card .ckey{font-size:10px;color:rgba(159,216,255,.5);letter-spacing:1px}

/* game over stats */
.stats{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:clamp(13px,3.4vmin,17px);letter-spacing:1px}
.stats .k{color:#9fd8ff;text-align:right}.stats .v{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
#final-score{font-size:clamp(38px,11vmin,72px);font-weight:900;color:#fff;letter-spacing:3px;
  text-shadow:0 0 24px rgba(65,242,255,.8);font-variant-numeric:tabular-nums;line-height:1}
#newbest{font-size:clamp(13px,3.4vmin,18px);font-weight:900;letter-spacing:4px;color:var(--gold);
  text-shadow:0 0 14px rgba(255,210,77,.8);animation:pulse .45s infinite alternate}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#debug{position:absolute;left:6px;bottom:6px;font:11px/1.5 monospace;color:#7fffd4;pointer-events:none;
  background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px;white-space:pre;z-index:99}

/* tuning lab */
#screen-tune{justify-content:flex-start;gap:10px}
#tune-list{width:min(560px,94vw);display:flex;flex-direction:column;gap:5px;margin-top:2px}
.tgroup{margin-top:12px;font-size:12px;font-weight:900;letter-spacing:4px;color:var(--gold);
  text-shadow:0 0 8px rgba(255,210,77,.5)}
.trow{display:flex;align-items:center;gap:10px}
.trow label{flex:0 0 44%;font-size:12px;letter-spacing:.5px;color:#9fd8ff;text-align:right;line-height:1.2}
.trow input[type=range]{flex:1;accent-color:#41f2ff;min-width:0;height:22px}
.trow .tval{flex:0 0 54px;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
#tune-json{width:min(560px,94vw);height:110px;background:rgba(4,10,24,.85);border:1px solid rgba(65,242,255,.4);
  border-radius:10px;color:#cfe9ff;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:8px;resize:vertical;
  -webkit-user-select:text;user-select:text}
#rotate-tip{font-size:11px;letter-spacing:1px;color:rgba(159,216,255,.5)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div></div>
    <div id="hud-top">
      <div id="score-box"><div id="score">0</div><div id="mult">×1</div></div>
      <div id="wave-box">WAVE 1</div>
      <button id="btn-pause" aria-label="Pause">▐▐</button>
    </div>
    <div id="bosshp" class="hidden"><div id="bosslabel">DREADNOUGHT</div><div id="bossfill"></div></div>
    <div id="hud-bottom">
      <div id="hp-wrap">
        <div id="shieldpips"></div>
        <div id="hpbar"><div id="hpfill"></div></div>
      </div>
      <div id="bombs">
        <div id="bombicons"></div>
        <button id="btn-bomb" aria-label="Bomb">NOVA</button>
      </div>
    </div>
    <div id="hint"></div>
    <div id="banner" class="hidden"><div class="big"></div><div class="sub"></div></div>
  </div>

  <div id="screen-menu" class="screen">
    <div class="logo">NOVA<br><em>SURGE</em></div>
    <div class="tagline">NEON ARENA SHOOTER</div>
    <div class="best" id="menu-best"></div>
    <button class="btn primary" id="btn-play">Launch</button>
    <div class="toggles">
      <button class="btn small" id="tg-music">MUSIC: ON</button>
      <button class="btn small" id="tg-sfx">SFX: ON</button>
      <button class="btn small" id="tg-shake">SHAKE: ON</button>
      <button class="btn small" id="tg-auto">AUTO-FIRE: ON</button>
    </div>
    <button class="btn small" id="btn-tune">⚙ Tuning Lab</button>
    <div class="controls-note" id="menu-controls"></div>
  </div>

  <div id="screen-pause" class="screen hidden">
    <h2 class="title">PAUSED</h2>
    <button class="btn primary" id="btn-resume">Resume</button>
    <button class="btn" id="btn-restart">Restart</button>
    <div class="toggles">
      <button class="btn small" id="tg-music2">MUSIC: ON</button>
      <button class="btn small" id="tg-sfx2">SFX: ON</button>
      <button class="btn small" id="tg-shake2">SHAKE: ON</button>
      <button class="btn small" id="tg-auto2">AUTO-FIRE: ON</button>
    </div>
    <button class="btn small" id="btn-tune2">⚙ Tuning Lab</button>
    <button class="btn small" id="btn-quit">Quit to Title</button>
  </div>

  <div id="screen-tune" class="screen hidden">
    <h2 class="title gold">TUNING LAB</h2>
    <div class="controls-note">Changes apply live &amp; save on this device.<br>COPY JSON and share it to make your settings the new defaults.</div>
    <div id="tune-list"></div>
    <textarea id="tune-json" spellcheck="false" aria-label="Tuning JSON"></textarea>
    <div class="row">
      <button class="btn small" id="btn-tune-copy">Copy JSON</button>
      <button class="btn small" id="btn-tune-apply">Apply JSON</button>
      <button class="btn small" id="btn-tune-reset">Reset Defaults</button>
      <button class="btn small primary" id="btn-tune-close">Close</button>
    </div>
  </div>

  <div id="screen-levelup" class="screen hidden">
    <h2 class="title gold">SYSTEM UPGRADE</h2>
    <div id="cards"></div>
  </div>

  <div id="screen-over" class="screen hidden">
    <h2 class="title red">SHIP DESTROYED</h2>
    <div id="final-score">0</div>
    <div id="newbest" class="hidden">★ NEW BEST ★</div>
    <div class="stats" id="over-stats"></div>
    <div class="row">
      <button class="btn primary" id="btn-retry">Retry</button>
      <button class="btn" id="btn-menu">Menu</button>
    </div>
  </div>

  <div id="debug" class="hidden"></div>
</div>
<noscript><p style="color:#fff;padding:40px;text-align:center">Nova Surge requires JavaScript.</p></noscript>
<script>
'use strict';
/* ============================================================================
   NOVA SURGE — a neon twin-stick arena shooter in one self-contained file.

   CONCEPT
     Survive escalating waves of geometric enemies in a bounded arena.
     Collect XP gems, pick 1-of-3 ship upgrades on level-up, fight a
     Dreadnought boss every 5th wave, and chase your best score with a
     kill-streak multiplier that resets when you get hit.

   CONTROLS
     Touch    — left thumb: move (dynamic virtual stick)
                right thumb: aim + fire · NOVA button: bomb · ▐▐: pause
     Keyboard — WASD / arrows: move · mouse: aim · click / hold: fire
                SPACE or SHIFT: nova bomb · P / ESC: pause · 1-3: pick upgrade
     Gamepad  — left stick: move · right stick: aim + fire (or RT)
                A / LB / RB: nova bomb · START: pause · D-pad + A: menus

   RUN
     Open this file in any modern browser, or serve it statically.
     Works offline. Progress and settings persist in localStorage
     under the key "novaSurge.v1".

   TECH
     No dependencies, no network requests, no build step. Canvas 2D with
     pre-rendered glow sprites, fixed 60 Hz simulation with an accumulator,
     procedural WebAudio SFX synth + 16-step layered music sequencer,
     pooled particles, adaptive resolution/particle quality scaling,
     safe-area aware responsive UI (portrait, landscape, any aspect ratio).

   TUNING LAB (⚙ on title & pause screens)
     Live sliders for the difficulty ramp: wave budgets, spawn pacing,
     enemy HP/speed scaling, boss cadence/count/HP, enemy fire, player
     stats and progression curves. Values apply immediately, persist on
     the device (localStorage "novaSurge.tune.v1"), and can be exported
     or imported as JSON — share the JSON to bake new defaults into CFG.
     Debug overlay: append ?debug=1 (G god · L level-up · K clear wave).

   THIRD-PARTY: none.
   ============================================================================ */

/* ---------------- CONFIG — all gameplay tuning ---------------- */
const CFG = {
  step: 1/60,                 // fixed simulation timestep (s)
  maxSteps: 5,                // spiral-of-death guard
  refView: 660,               // world units across the short screen axis
  minScale: 0.5, maxScale: 2.2,
  maxDpr: 2,
  arena: 2300,                // arena is a square, side length in world units
  player: {
    r: 15, accel: 2600, friction: 6.5, speed: 350,
    maxHp: 100, iFrames: 1.1, regenDelay: 6, regenRate: 3,
    fireRate: 4.4, dmg: 10, bulletSpeed: 880, range: 760,
    magnetR: 140, bombs: 2, bombMax: 2,
  },
  bullet: { r: 5, knock: 60 },
  ebullet: { r: 6, speed: 250, speedPerWave: 5, speedCap: 430, dmg: 14, life: 5 },
  bomb: { radius: 720, dmg: 160, shake: 26 },
  drone: { orbitR: 58, orbitSpeed: 2.4, fireCd: 0.75, range: 520, dmgMul: 0.6 },
  gem: { r: 7, life: 13, pullAccel: 2400, maxPull: 1300 },
  heart: { r: 10, heal: 25, life: 15, chance: 0.015 },
  bombDrop: { chance: 0.004 },
  mult: { killsPerStep: 8, max: 10 },
  waves: {
    baseBudget: 8, budgetPerWave: 4, budgetQuad: 0.08,
    groupMin: 2, groupMax: 5,
    intervalStart: 2.4, intervalMin: 1.15, intervalPerWave: 0.06,
    intermission: 2.6, bossEvery: 5, maxEnemies: 110,
    hpScale: 0.055, speedScale: 0.012, speedScaleCap: 1.5,
  },
  boss: { baseHp: 950, hpPerCycle: 0.65, r: 56, contactDmg: 30, score: 5000,
          maxCount: 3, extraEvery: 2, multiHpMul: 0.7 },
  particles: { max: 900 },
  shake: { hit: 10, kill: 2.5, big: 7, max: 30, decay: 34 },
  stick: { deadZone: 0.18, radius: 62 },
  xpCurve: { base: 6, lin: 4, quad: 0.45 },
  xp: lvl => Math.round(CFG.xpCurve.base + lvl*CFG.xpCurve.lin + lvl*lvl*CFG.xpCurve.quad),
  save: 'novaSurge.v1',
};

const ENEMY_TYPES = {
  chaser:  { hp: 20,  r: 16, speed: 150, dmg: 12, score: 100, xp: 1, color: '#ff5a5a', cost: 1,   minWave: 1,  w: 10 },
  weaver:  { hp: 14,  r: 14, speed: 235, dmg: 10, score: 150, xp: 1, color: '#ffb84d', cost: 1.5, minWave: 2,  w: 7 },
  splitter:{ hp: 30,  r: 19, speed: 120, dmg: 12, score: 200, xp: 2, color: '#5aff8a', cost: 2,   minWave: 3,  w: 5 },
  drifter: { hp: 42,  r: 21, speed: 95,  dmg: 14, score: 120, xp: 2, color: '#b06bff', cost: 2,   minWave: 4,  w: 5 },
  shooter: { hp: 26,  r: 17, speed: 115, dmg: 10, score: 250, xp: 3, color: '#ff5ad2', cost: 3,   minWave: 4,  w: 4 },

/* ---------------- Utilities ---------------- */
const TAU = Math.PI*2;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const rand = (a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b+1));
const pick = arr=>arr[(Math.random()*arr.length)|0];
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const angLerp = (a,b,t)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t};
const fmt = n=>n.toLocaleString('en-US');
const fmtTime = s=>{const m=(s/60)|0,ss=(s%60)|0;return m+':'+String(ss).padStart(2,'0')};

/* ---------------- Persistence ---------------- */
const Save = {
  data: null,
  defaults(){ return { version:1, best:{score:0,wave:0,kills:0}, plays:0,
    settings:{music:true,sfx:true,shake:true,autofire:true} }; },
  load(){
    let d = this.defaults();
    try {
      const raw = localStorage.getItem(CFG.save);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === 'object' && p.version === 1) {
          d.best = Object.assign(d.best, p.best||{});
          d.settings = Object.assign(d.settings, p.settings||{});
          d.plays = p.plays|0;
        }
      }
    } catch(e) { /* corrupted save — fall back to defaults */ }
    this.data = d;
    return d;
  },
  write(){ try { localStorage.setItem(CFG.save, JSON.stringify(this.data)); } catch(e){} },
};

/* ---------------- Audio: tiny synth + layered music sequencer ---------------- */
const AudioSys = {
  ctx:null, master:null, sfxBus:null, musBus:null, noiseBuf:null, unlocked:false,
  init(){
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
    this.musBus = c.createGain(); this.musBus.connect(this.master);
    this.applySettings();
    // 1s of white noise, reused by every noise-based sound
    const len = c.sampleRate|0, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noiseBuf = buf;
    return true;
  },
  unlock(){
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.unlocked = true;
    Music.ensure();
  },
  applySettings(){
    if (!this.ctx) return;
    const s = Save.data.settings;
    this.sfxBus.gain.value = s.sfx ? 0.85 : 0;
    this.musBus.gain.value = s.music ? 0.5 : 0;
  },
  suspend(){ if (this.ctx && this.ctx.state==='running') this.ctx.suspend(); },
  resume(){ if (this.ctx && this.unlocked && this.ctx.state==='suspended') this.ctx.resume(); },

  tone({f=440,f2=null,type='square',d=0.15,v=0.3,a=0.003,fl=0,fl2=0,q=1,delay=0,bus=null}={}){
    if (!this.ctx || !this.unlocked) return;
    const c=this.ctx, t0=c.currentTime+delay;
    const o=c.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(Math.max(1,f),t0);
    if (f2!==null) o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+d);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    let head=o;
    if (fl>0){ const flt=c.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=q;
      flt.frequency.setValueAtTime(fl,t0);
      if (fl2>0) flt.frequency.exponentialRampToValueAtTime(fl2,t0+d);
      o.connect(flt); head=flt; }
    head.connect(g); g.connect(bus||this.sfxBus);
    o.start(t0); o.stop(t0+d+0.05);
  },
  noise({d=0.2,v=0.3,a=0.003,fl=1400,fl2=0,type='lowpass',q=1,delay=0,rate=1,bus=null}={}){
    if (!this.ctx || !this.unlocked) return;
    const c=this.ctx, t0=c.currentTime+delay;
    const src=c.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true; src.playbackRate.value=rate;
    const flt=c.createBiquadFilter(); flt.type=type; flt.Q.value=q;
    flt.frequency.setValueAtTime(fl,t0);
    if (fl2>0) flt.frequency.exponentialRampToValueAtTime(fl2,t0+d);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(v,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    src.connect(flt); flt.connect(g); g.connect(bus||this.sfxBus);
    src.start(t0); src.stop(t0+d+0.05);
  },
};

/* Music: 16-step sequencer, A-minor progression, intensity layers 0..3 */
const Music = {
  bpm:116, step:0, bar:0, nextT:0, timer:null, playing:false, intensity:0, mode:'menu',
  chords:[ [45,57,60,64], [41,53,57,60], [36,48,52,55], [43,55,59,62] ], // Am F C G (midi)
  pent:[0,3,5,7,10,12,15],
  midi(m){ return 440*Math.pow(2,(m-69)/12); },
  ensure(){ if (!this.playing && AudioSys.unlocked) this.start(); },
  start(){
    if (this.playing || !AudioSys.ctx) return;
    this.playing = true;
    this.nextT = AudioSys.ctx.currentTime + 0.06;
    this.step = 0; this.bar = 0;
    this.timer = setInterval(()=>this.pump(), 40);
  },
  stop(){ this.playing=false; if (this.timer) clearInterval(this.timer); this.timer=null; },
  pump(){
    if (!AudioSys.ctx || AudioSys.ctx.state!=='running') return;
    const now = AudioSys.ctx.currentTime;
    if (this.nextT < now - 0.4) this.nextT = now + 0.02; // recover after tab sleep
    while (this.nextT < now + 0.14) {
      this.play(this.step, this.nextT);
      this.nextT += 60/this.bpm/4; // 16th notes
      this.step++;
      if (this.step % 16 === 0) this.bar++;
    }
  },
  play(step, t){
    const bus = AudioSys.musBus, s = step % 16, chord = this.chords[this.bar % 4];
    const I = this.mode==='menu' ? 0 : this.intensity;
    const T = AudioSys, root = chord[0];
    // pad (always, gentle) on beat 1
    if (s===0){
      chord.slice(1).forEach((m,i)=>T.tone({f:this.midi(m),type:'triangle',d:60/this.bpm*3.6,v:0.05,a:0.4,bus,delay:t-T.ctx.currentTime}));
    }
    const dl = t - T.ctx.currentTime;
    // bass: 8ths, root/octave bounce (game only)
    if (I>=1 && s%2===0){
      const oct = (s%4===2)?12:0;
      T.tone({f:this.midi(root+oct),type:'sawtooth',d:0.16,v:0.16,fl:520,fl2:180,q:4,delay:dl,bus});
    }
    // kick on quarters
    if (I>=1 && s%4===0) T.tone({f:130,f2:38,type:'sine',d:0.14,v:0.42,delay:dl,bus});
    // hats: offbeat at I1, 8ths at I2+
    if ((I>=2 && s%2===1) || (I===1 && s%4===2))
      T.noise({d:0.045,v:0.07,fl:6500,type:'highpass',delay:dl,bus});
    // snare
    if (I>=2 && (s===4||s===12))
      T.noise({d:0.14,v:0.16,fl:1700,type:'bandpass',q:0.8,delay:dl,bus});
    // arp lead at I2+, denser at I3
    if (I>=2 && (s%2===0 || I>=3)){
      const n = root+12+this.pent[(step*7+this.bar*3)%this.pent.length]+12;
      T.tone({f:this.midi(n),type:'square',d:0.09,v:I>=3?0.075:0.055,fl:2600,fl2:900,delay:dl,bus});
    }
  },
};

/* ---------------- Input: touch twin-sticks, keyboard+mouse, gamepad ---------------- */
const Input = {
  keys: Object.create(null),
  mouse: { x:0, y:0, down:false },
  sticks: {
    move: { id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0 },
    aim:  { id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0 },
  },
  pad: { ok:false, index:-1, prev:[] },
  lastType: 'touch',            // 'touch' | 'kb' | 'pad'
  // aggregated per-step values:
  move: { x:0, y:0 },
  aim:  { x:0, y:0, active:false },
  firing: false,
  bombEdge: false, pauseEdge: false, confirmEdge: false, navEdge: 0,
  _bombQueued:false, _pauseQueued:false, _confirmQueued:false, _navQueued:0,

  init(){
    addEventListener('keydown', e=>{
      // let form controls (tuning sliders / JSON textarea) behave normally
      const tag = e.target && e.target.tagName;
      if ((tag==='TEXTAREA' || tag==='INPUT') && e.code!=='Escape') return;
      if (e.repeat) return;
      this.keys[e.code] = true;
      this.lastType = 'kb';
      // edge-triggered actions are queued here so a fast tap between
      // fixed-update polls can never be missed
      if (e.code==='Space' || e.code==='ShiftLeft' || e.code==='ShiftRight') this._bombQueued = true;
      if (e.code==='Escape' || e.code==='KeyP') this._pauseQueued = true;
      if (e.code==='Enter' || e.code==='Space') this._confirmQueued = true;
      if (e.code==='ArrowLeft') this._navQueued = -1;
      if (e.code==='ArrowRight') this._navQueued = 1;
      if (e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3') this._digitQueued = +e.code.slice(-1);
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
    }, {passive:false});
    addEventListener('keyup', e=>{ this.keys[e.code] = false; });
    addEventListener('blur', ()=>{ this.keys = Object.create(null); this.mouse.down = false; this.releaseSticks(); });

    const cv = document.getElementById('cv');
    cv.addEventListener('pointerdown', e=>this.pointerDown(e));
    addEventListener('pointermove', e=>this.pointerMove(e));
    addEventListener('pointerup',   e=>this.pointerUp(e));
    addEventListener('pointercancel', e=>this.pointerUp(e));
    cv.addEventListener('contextmenu', e=>e.preventDefault());
    // block iOS pinch/double-tap zoom inside the game
    ['gesturestart','gesturechange'].forEach(ev=>addEventListener(ev, e=>e.preventDefault()));

    addEventListener('gamepadconnected', e=>{ this.pad.ok = true; this.pad.index = e.gamepad.index; this.lastType='pad'; UI.refreshHints(); });
    addEventListener('gamepaddisconnected', ()=>{ this.pad.ok = false; });
  },

  pointerDown(e){
    e.preventDefault();
    if (e.pointerType === 'mouse'){
      this.lastType = 'kb';
      this.mouse.down = true;
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      return;
    }
    this.lastType = 'touch';
    const s = this.sticks;
    let st;
    if (Save.data.settings.autofire){
      // auto-fire mode: first touch is ALWAYS movement, wherever it lands;
      // a second concurrent touch engages the aim-override stick
      st = s.move.id === null ? s.move : (s.aim.id === null ? s.aim : null);
    } else {
      // manual mode: classic split — left half moves, right half aims
      st = e.clientX < innerWidth/2 ? s.move : s.aim;
      if (st.id !== null) st = null;
    }
    if (!st) return;
    st.id = e.pointerId; st.ox = st.x = e.clientX; st.oy = st.y = e.clientY; st.dx = st.dy = 0;
  },
  pointerMove(e){
    if (e.pointerType === 'mouse'){
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      return;
    }
    const s = this.sticks;
    for (const k of ['move','aim']){
      const st = s[k];
      if (st.id === e.pointerId){
        st.x = e.clientX; st.y = e.clientY;
        let dx = st.x - st.ox, dy = st.y - st.oy;
        const R = CFG.stick.radius, len = Math.hypot(dx,dy);
        if (len > R){ // let the stick base drag along for comfy long swipes
          st.ox = st.x - dx/len*R; st.oy = st.y - dy/len*R;
          dx = dx/len*R; dy = dy/len*R;
        }
        st.dx = dx/R; st.dy = dy/R;
      }
    }
  },
  pointerUp(e){
    if (e.pointerType === 'mouse'){ this.mouse.down = false; return; }
    const s = this.sticks;
    for (const k of ['move','aim']){
      const st = s[k];
      if (st.id === e.pointerId){ st.id = null; st.dx = st.dy = 0; }
    }
  },
  releaseSticks(){
    for (const k of ['move','aim']){ const st=this.sticks[k]; st.id=null; st.dx=st.dy=0; }
  },
  queueBomb(){ this._bombQueued = true; },
  queuePause(){ this._pauseQueued = true; },

  /* called once per fixed step; playerScreen = player position in css px */
  poll(playerScreen){
    const dz = CFG.stick.deadZone;
    let mx=0, my=0, ax=0, ay=0, aimActive=false, firing=false;
    let bomb=false, pause=false, confirm=false, nav=0;

    // --- gamepad ---
    if (this.pad.ok){
      const gp = navigator.getGamepads && navigator.getGamepads()[this.pad.index];
      if (gp){
        const a = gp.axes;
        const gmx = a[0]||0, gmy = a[1]||0, gax = a[2]||0, gay = a[3]||0;
        if (Math.hypot(gmx,gmy) > dz){ mx = gmx; my = gmy; this.lastType='pad'; }
        if (Math.hypot(gax,gay) > 0.32){ ax = gax; ay = gay; aimActive = true; firing = true; this.lastType='pad'; }
        const b = gp.buttons;
        const bp = i => !!(b[i] && b[i].pressed);
        if (bp(7)) firing = true; // right trigger fires even without aim stick
        const bombNow = bp(0)||bp(4)||bp(5)||bp(6);
        const pauseNow = bp(9);
        const confirmNow = bp(0);
        const navNow = bp(14)?-1:bp(15)?1:(a[0]<-0.6?-1:a[0]>0.6?1:0);
        if (bombNow && !this.pad.prev[0]) bomb = true;
        if (pauseNow && !this.pad.prev[1]) pause = true;
        if (confirmNow && !this.pad.prev[2]) confirm = true;
        if (navNow !== 0 && this.pad.prev[3] === 0) nav = navNow;
        this.pad.prev = [bombNow, pauseNow, confirmNow, navNow];
      }
    }

    // --- touch sticks (override pad if active) ---
    const sm = this.sticks.move, sa = this.sticks.aim;
    if (sm.id !== null && Math.hypot(sm.dx,sm.dy) > dz){ mx = sm.dx; my = sm.dy; }
    if (sa.id !== null && Math.hypot(sa.dx,sa.dy) > dz*1.2){ ax = sa.dx; ay = sa.dy; aimActive = true; firing = true; }

    // --- keyboard ---
    const K = this.keys;
    let kx = (K.KeyD||K.ArrowRight?1:0) - (K.KeyA||K.ArrowLeft?1:0);
    let ky = (K.KeyS||K.ArrowDown?1:0) - (K.KeyW||K.ArrowUp?1:0);
    if (kx||ky){ const l=Math.hypot(kx,ky); mx = kx/l; my = ky/l; this.lastType='kb'; }
    // mouse aim (only when keyboard/mouse is the active scheme)
    if (this.lastType === 'kb' && playerScreen){
      const dx = this.mouse.x - playerScreen.x, dy = this.mouse.y - playerScreen.y;
      if (Math.hypot(dx,dy) > 4){ ax = dx; ay = dy; aimActive = true; }
      if (this.mouse.down) firing = true;
    }

    // keyboard/UI queued edges
    if (this._bombQueued){ bomb = true; this._bombQueued = false; }
    if (this._pauseQueued){ pause = true; this._pauseQueued = false; }
    if (this._confirmQueued){ confirm = true; this._confirmQueued = false; }
    if (this._navQueued){ nav = this._navQueued; this._navQueued = 0; }
    this.digitEdge = this._digitQueued || 0; this._digitQueued = 0;

    // normalize move
    const ml = Math.hypot(mx,my);
    if (ml > 1){ mx/=ml; my/=ml; }
    const al = Math.hypot(ax,ay);
    if (al > 0){ ax/=al; ay/=al; }

    this.move.x = mx; this.move.y = my;
    this.aim.x = ax; this.aim.y = ay; this.aim.active = aimActive;
    this.firing = firing;
    this.bombEdge = bomb; this.pauseEdge = pause; this.confirmEdge = confirm; this.navEdge = nav;
  },
};

/* ---------------- Renderer core ---------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, VIEW_SCALE=1, renderScale=1;

const cam = { x:0, y:0, tx:0, ty:0, shake:0, sx:0, sy:0, kick:0 };

function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio||1, CFG.maxDpr) * renderScale;
  cv.width = Math.max(1, Math.round(W*DPR));
  cv.height = Math.max(1, Math.round(H*DPR));
  VIEW_SCALE = clamp(Math.min(W,H)/CFG.refView, CFG.minScale, CFG.maxScale);
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 60));

function worldToScreen(x,y){
  return { x:(x-cam.x-cam.sx)*VIEW_SCALE + W/2, y:(y-cam.y-cam.sy)*VIEW_SCALE + H/2 };
}
function viewHalf(){ return { w:W/2/VIEW_SCALE, h:H/2/VIEW_SCALE }; }

function addShake(n){
  if (!Save.data.settings.shake) n *= 0.25;
  cam.shake = Math.min(CFG.shake.max, cam.shake + n);
}

/* pre-rendered radial glow sprites, cached per color */
const glowCache = new Map();
function glow(color){
  let g = glowCache.get(color);
  if (!g){
    const s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    gr.addColorStop(0, color);
    gr.addColorStop(0.35, color);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.globalAlpha = 0.85;
    x.fillStyle = gr;
    x.fillRect(0,0,s,s);
    glowCache.set(color, g = c);
  }
  return g;
}
function drawGlow(x,y,r,color,alpha){
  ctx.globalAlpha = alpha;
  ctx.drawImage(glow(color), x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
}

/* ---------------- Background: parallax stars + reactive grid ---------------- */
const stars = [];
(function(){
  for (let i=0;i<130;i++) stars.push({
    x: rand(-CFG.arena*0.75, CFG.arena*0.75),
    y: rand(-CFG.arena*0.75, CFG.arena*0.75),
    z: rand(0.25,0.7), s: rand(0.6,2.0), tw: rand(TAU),
  });
})();
let gridPulse = 0; // 0..1, decays; bumped by kicks/bass events

function drawBackground(t){
  ctx.fillStyle = '#050510';
  ctx.fillRect(0,0,W,H);

  // stars (parallax by z)
  ctx.fillStyle = '#9fd8ff';
  for (const s of stars){
    const sx = (s.x - cam.x*s.z)*VIEW_SCALE + W/2;
    const sy = (s.y - cam.y*s.z)*VIEW_SCALE + H/2;
    // wrap into view
    const wx = ((sx % W) + W) % W, wy = ((sy % H) + H) % H;
    const a = 0.25 + 0.35*Math.sin(t*1.4 + s.tw)**2;
    ctx.globalAlpha = a*s.z*1.4;
    ctx.fillRect(wx, wy, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // grid
  const spacing = 110, vh = viewHalf();
  const x0 = cam.x+cam.sx - vh.w, x1 = cam.x+cam.sx + vh.w;
  const y0 = cam.y+cam.sy - vh.h, y1 = cam.y+cam.sy + vh.h;
  const ga = 0.05 + gridPulse*0.12;
  ctx.strokeStyle = 'rgba(65,160,255,' + ga.toFixed(3) + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = Math.floor(x0/spacing)*spacing; gx <= x1; gx += spacing){
    const s = worldToScreen(gx, 0);
    ctx.moveTo(s.x, 0); ctx.lineTo(s.x, H);
  }
  for (let gy = Math.floor(y0/spacing)*spacing; gy <= y1; gy += spacing){
    const s = worldToScreen(0, gy);
    ctx.moveTo(0, s.y); ctx.lineTo(W, s.y);
  }
  ctx.stroke();

  // arena border
  const A = CFG.arena/2;
  const tl = worldToScreen(-A,-A), br = worldToScreen(A,A);
  ctx.strokeStyle = 'rgba(65,242,255,'+(0.35+gridPulse*0.3).toFixed(3)+')';
  ctx.lineWidth = 3;
  ctx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
  ctx.strokeStyle = 'rgba(65,242,255,0.10)';
  ctx.lineWidth = 9;
  ctx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
}

/* vignette overlay (cached at canvas size) */
let vigCanvas = null, vigW = 0, vigH = 0;
function drawVignette(lowHp){
  if (!vigCanvas || vigW!==W || vigH!==H){
    vigW=W; vigH=H;
    vigCanvas = document.createElement('canvas');
    vigCanvas.width = Math.max(1,W>>1); vigCanvas.height = Math.max(1,H>>1);
    const x = vigCanvas.getContext('2d');
    const g = x.createRadialGradient(W/4,H/4, Math.min(W,H)/4.4, W/4,H/4, Math.max(W,H)/1.9);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,20,0.55)');
    x.fillStyle=g; x.fillRect(0,0,W/2,H/2);
  }
  ctx.drawImage(vigCanvas, 0,0, W, H);
  if (lowHp > 0){
    ctx.fillStyle = 'rgba(255,30,40,' + (lowHp*0.16*(0.7+0.3*Math.sin(performance.now()/140))).toFixed(3) + ')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------------- Particles (pooled) ---------------- */
const particles = [];
let particleBudget = CFG.particles.max;
function spawnP(o){
  if (particles.length >= particleBudget){
    // recycle the oldest
    const p = particles.shift();
    particles.push(Object.assign(p, o));
    return;
  }
  particles.push(o);
}
function burst(x,y,color,n,speed,life,size){
  n = Math.round(n * (particleBudget/CFG.particles.max));
  for (let i=0;i<n;i++){
    const a = rand(TAU), v = rand(speed*0.25, speed);
    spawnP({ x,y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      life:rand(life*0.5,life), maxLife:life, size:rand(size*0.6,size*1.4),
      color, drag:rand(1.5,4), ring:false });
  }
}
function ring(x,y,color,r0,vr,life,width){
  spawnP({ x,y, vx:0, vy:0, life, maxLife:life, size:width||3, color, drag:0, ring:true, r:r0, vr });
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles[i]=particles[particles.length-1]; particles.pop(); continue; }
    if (p.ring){ p.r += p.vr*dt; p.vr *= (1-1.8*dt); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    const d = 1 - p.drag*dt;
    p.vx *= d; p.vy *= d;
  }
}
function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    const a = clamp(p.life/p.maxLife, 0, 1);
    const s = worldToScreen(p.x, p.y);
    if (s.x<-40||s.x>W+40||s.y<-40||s.y>H+40) continue;
    if (p.ring){
      ctx.globalAlpha = a*0.8;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size*a*VIEW_SCALE;
      ctx.beginPath();
      ctx.arc(s.x, s.y, Math.max(0.5,p.r*VIEW_SCALE), 0, TAU);
      ctx.stroke();
    } else {
      const sz = p.size*a*VIEW_SCALE;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(s.x-sz/2, s.y-sz/2, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- Floating score text ---------------- */
const popups = [];
function popup(x,y,text,color,big){
  if (popups.length > 40) popups.shift();
  popups.push({x,y,text,color:color||'#fff',life:0.9,maxLife:0.9,big:!!big,vy:-70});
}
function updatePopups(dt){
  for (let i=popups.length-1;i>=0;i--){
    const p = popups[i];
    p.life -= dt; p.y += p.vy*dt; p.vy *= (1-2.5*dt);
    if (p.life<=0){ popups[i]=popups[popups.length-1]; popups.pop(); }
  }
}
function drawPopups(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const p of popups){
    const a = clamp(p.life/p.maxLife,0,1);
    const s = worldToScreen(p.x,p.y);
    const fs = (p.big?26:15)*VIEW_SCALE;
    ctx.font = '800 '+fs+'px system-ui,sans-serif';
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fillText(p.text, s.x, s.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

/* ---------------- Game state ---------------- */
let state = 'menu'; // menu | playing | levelup | paused | over
const game = {
  time:0, score:0, kills:0, streak:0, mult:1, maxMult:1,
  wave:0, xp:0, level:1, xpNext:CFG.xp(1),
  bombs:CFG.player.bombs, bombMax:CFG.player.bombMax,
  timescale:1, tsTarget:1, hitStop:0,
  levelupsQueued:0, over:false, overTimer:0,
  player:null, enemies:[], bullets:[], ebullets:[], gems:[], hearts:[], drones:[],
  spawner:null, up:{},
};

function bossesAlive(){
  let n = 0;
  for (const e of game.enemies) if (e.boss) n++;
  return n;
}

function makePlayer(){
  return {
    x:0, y:0, vx:0, vy:0, angle:-Math.PI/2, r:CFG.player.r,
    hp:CFG.player.maxHp, maxHp:CFG.player.maxHp,
    iTime:0, fireCd:0, lastHurt:99, trailT:0,
    shieldMax:0, shield:0, shieldT:0,
    stats:null,
  };
}

function recomputeStats(){
  const u = game.up, B = CFG.player, p = game.player;
  const s = {
    fireRate: B.fireRate * Math.pow(1.22, u.rate||0),
    dmg:      B.dmg * Math.pow(1.25, u.dmg||0),
    shots:    1 + (u.multi||0),
    pierce:   (u.pierce||0),
    bulletSpeed: B.bulletSpeed * Math.pow(1.20, u.velocity||0),
    range:    B.range * Math.pow(1.15, u.velocity||0),
    speed:    B.speed * Math.pow(1.12, u.speed||0),
    maxHp:    B.maxHp + 30*(u.hull||0),
    magnetR:  B.magnetR * (1 + 0.7*(u.magnet||0)),
    homing:   (u.homing||0),
    drones:   (u.drone||0),
    shieldCd: (u.shield||0) >= 2 ? 9 : 14,
    critChance: 0.15*(u.crit||0),
    blast:    (u.blast||0),
    blastR:   55 + 30*(u.blast||0),
    ricochet: (u.ricochet||0),
    auraLvl:  (u.aura||0),
    auraR:    95 + 35*(u.aura||0),
    leech:    (u.leech||0),
    overdrive:(u.overdrive||0),
  };
  p.stats = s;
  p.maxHp = s.maxHp;
  p.hp = Math.min(p.hp, p.maxHp);
  p.shieldMax = (u.shield||0) > 0 ? 1 : 0;
  game.bombMax = Math.max(CFG.player.bombMax, Math.round(CFG.player.bombs)) + (u.bomb||0);
  // sync drones
  while (game.drones.length < s.drones)
    game.drones.push({ phase: game.drones.length, cd: 0 });
  return s;
}

function newGame(){
  game.time=0; game.score=0; game.kills=0; game.streak=0; game.mult=1; game.maxMult=1;
  game.wave=0; game.xp=0; game.level=1; game.xpNext=CFG.xp(1);
  game.bombs=Math.round(CFG.player.bombs);
  game.bombMax=Math.max(CFG.player.bombMax, Math.round(CFG.player.bombs));
  game.timescale=1; game.tsTarget=1; game.hitStop=0;
  game.levelupsQueued=0; game.over=false; game.overTimer=0;
  game.enemies.length=0; game.bullets.length=0; game.ebullets.length=0;
  game.gems.length=0; game.hearts.length=0; game.drones.length=0;
  game.up={};
  UI.showBossBar(false);
  game.player = makePlayer();
  recomputeStats();
