<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rallycross Challenge</title>
<style>
:root {
  --yellow: #ffb020;
  --blue: #b44a0a;
  --dark: #060a14;
  --red: #e03030;
  --font: 'Arial Narrow', 'Helvetica Neue Condensed', Impact, Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--dark); font-family: var(--font); }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }

/* ---------- menus ---------- */
#menu {
  position: absolute; inset: 0; display: none; flex-direction: column;
  align-items: center;
  background:
    linear-gradient(115deg, rgba(6,10,20,0.94) 0%, rgba(10,25,60,0.92) 45%, rgba(6,10,20,0.96) 100%),
    repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,204,0,0.05) 90px 118px);
  pointer-events: auto;
  color: #fff;
  overflow-y: auto;
}
.m-inner { width: min(680px, 94vw); padding: 2vh 12px 2.5vh; text-align: left; margin: auto; }
.m-head { border-left: 6px solid var(--yellow); padding-left: 14px; margin-bottom: 1.6vh; }
.m-eyebrow { color: var(--yellow); font-weight: 700; letter-spacing: 2.5px; font-size: clamp(11px, 1.6vh, 14px); margin-bottom: 4px; }
.m-title { font-style: italic; font-weight: 900; font-size: clamp(22px, 5vh, 44px); line-height: 1.02; letter-spacing: 0.5px; text-transform: uppercase; text-shadow: 3px 3px 0 rgba(0,0,0,0.55); }
.m-sub { color: #b8c4dc; font-size: clamp(12px, 2vh, 16px); margin-top: 8px; letter-spacing: 0.5px; }
.logo-crash { color: var(--yellow); }
.logo-rally { color: #fff; }
.press-start { color: var(--yellow); font-weight: 700; font-size: clamp(13px, 2.2vh, 18px); letter-spacing: 3px; animation: blink 1.2s step-end infinite; margin: 1vh 0; }
@keyframes blink { 50% { opacity: 0.25; } }
.m-body { color: #cdd6e6; font-size: clamp(12px, 1.9vh, 15px); line-height: 1.5; margin-bottom: 2vh; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; }
.help-grid b { color: var(--yellow); letter-spacing: 1.5px; }
.m-list { display: flex; flex-direction: column; gap: 5px; margin-top: 0.8vh; }
.m-item {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: clamp(5px, 1vh, 10px) 14px;
  background: rgba(255,255,255,0.045);
  border-left: 4px solid transparent;
  cursor: pointer;
  transition: background 0.08s, border-color 0.08s, transform 0.08s;
}
.m-item .m-label { font-style: italic; font-weight: 900; font-size: clamp(14px, 2.3vh, 20px); letter-spacing: 1px; text-transform: uppercase; }
.m-item .m-value { color: var(--yellow); font-weight: 700; font-size: clamp(11px, 1.7vh, 14px); letter-spacing: 1px; margin-left: auto; }
.m-item .m-hint { flex-basis: 100%; color: #8fa0be; font-size: clamp(9px, 1.35vh, 12px); letter-spacing: 0.4px; }
.m-item.sel { background: var(--yellow); border-left-color: #fff; transform: translateX(6px); }
.m-item.sel .m-label { color: #10131c; }
.m-item.sel .m-value { color: #333c14; }
.m-item.sel .m-hint { color: #4a4a22; }
.m-item.dis { opacity: 0.35; cursor: default; }
.m-item.danger .m-label { color: #ff7a6e; }
.m-item.danger.sel { background: var(--red); }
.m-item.danger.sel .m-label { color: #fff; }
.m-footer { margin-top: 1.6vh; color: #6d7d9c; letter-spacing: 2px; font-size: clamp(10px, 1.5vh, 12px); font-weight: 700; }
.m-table { margin: 0.8vh 0 1.2vh; }
.m-table table { width: 100%; border-collapse: collapse; }
.m-table th { text-align: left; color: var(--yellow); font-size: clamp(10px, 1.5vh, 12px); letter-spacing: 2px; padding: 4px 10px; border-bottom: 1px solid rgba(255,204,0,0.35); }
.m-table td { padding: clamp(3px, 0.7vh, 6px) 10px; font-size: clamp(13px, 2vh, 17px); font-weight: 700; font-style: italic; letter-spacing: 0.5px; color: #dfe6f2; border-bottom: 1px solid rgba(255,255,255,0.06); }
.m-table tr.me td { color: var(--yellow); background: rgba(255,204,0,0.08); }
.car-dot { display: inline-block; width: 0.85em; height: 0.85em; border-radius: 2px; margin-right: 10px; border: 1px solid rgba(255,255,255,0.5); }
.car-preview {
  width: 100%; height: clamp(120px, 24vh, 220px);
  background: radial-gradient(ellipse at 50% 80%, rgba(30,50,95,0.55), rgba(6,10,20,0.1) 70%);
  border: 1px solid rgba(255,204,0,0.25);
  border-left: 4px solid var(--yellow);
  margin-bottom: 1vh;
  overflow: hidden;
}
.car-preview canvas { width: 100%; height: 100%; display: block; }
.car-info {
  color: #b8c4dc; font-size: clamp(11px, 1.7vh, 14px); line-height: 1.45;
  padding: 4px 2px 2px; min-height: 2.9em;
}
.car-info .ci-name { color: var(--yellow); font-weight: 900; font-style: italic; letter-spacing: 1px; }
.car-info .ci-stats { color: var(--yellow); font-weight: 700; font-size: 0.92em; letter-spacing: 0.5px; }
.m-list.cargrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.m-list.cargrid .m-item { min-width: 0; }
.m-list.cargrid .m-item.tile { padding: clamp(8px, 1.3vh, 12px) 12px; }
.m-list.cargrid .m-item.sel { transform: none; }
.m-list.cargrid .m-item.tile .m-label { font-size: clamp(13px, 2vh, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-list.cargrid .m-item.wide { grid-column: 1 / -1; }

/* ---------- tuning / debug panel ---------- */
#debugbtn {
  position: fixed; left: 10px; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(10,20,40,0.75); border: 2px solid rgba(255,204,0,0.55);
  color: var(--yellow); font-size: 19px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto; cursor: pointer; z-index: 60;
  user-select: none;
}
#debugbtn.open { background: var(--yellow); color: #10131c; }
#debugpanel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(400px, 100vw);
  background: rgba(8,13,26,0.97);
  border-left: 2px solid var(--yellow);
  display: none; flex-direction: column;
  pointer-events: auto; z-index: 55;
  font-family: var(--font); color: #dfe6f2;
}
@media (max-width: 700px) {
  #debugpanel { top: auto; left: 0; width: 100vw; height: 62vh; border-left: none; border-top: 2px solid var(--yellow); }
}
.dbg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; }
.dbg-title { color: var(--yellow); font-weight: 900; font-style: italic; letter-spacing: 3px; font-size: 18px; }
.dbg-x { background: none; border: none; color: #9aa8c4; font-size: 18px; cursor: pointer; padding: 4px 8px; }
.dbg-tabs {
  display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 8px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin; flex: none;
}
.dbg-tab {
  flex: none; background: rgba(255,255,255,0.07); border: none;
  color: #aab6cc; font-family: var(--font); font-weight: 900; font-style: italic;
  font-size: 12px; letter-spacing: 1px; padding: 7px 11px; cursor: pointer; border-radius: 3px;
}
.dbg-tab.on { background: var(--yellow); color: #10131c; }
.dbg-body { flex: 1; overflow-y: auto; padding: 4px 14px 10px; -webkit-overflow-scrolling: touch; }
.dbg-row { padding: 7px 0 2px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.dbg-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; color: #c5d0e4; }
.dbg-val { color: var(--yellow); font-family: 'Courier New', monospace; font-weight: 700; }
.dbg-range { width: 100%; margin: 8px 0 4px; accent-color: #ffcc00; height: 22px; touch-action: none; }
.dbg-toggle {
  margin: 4px 0 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  color: #aab6cc; font-family: var(--font); font-weight: 900; font-size: 12px; letter-spacing: 1px;
  padding: 6px 18px; cursor: pointer; border-radius: 3px;
}
.dbg-toggle.on { background: rgba(120,220,120,0.25); border-color: #6d4; color: #b8f0b8; }
.dbg-note { color: #6d7d9c; font-size: 11px; letter-spacing: 0.4px; padding: 10px 0; }
.dbg-foot {
  flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px;
  border-top: 1px solid rgba(255,204,0,0.3);
}
.dbg-btn {
  background: rgba(255,204,0,0.14); border: 1px solid rgba(255,204,0,0.5); color: var(--yellow);
  font-family: var(--font); font-weight: 900; font-style: italic; font-size: 12px; letter-spacing: 1px;
  padding: 8px 12px; cursor: pointer; border-radius: 3px;
}
.dbg-btn.warn { background: rgba(224,48,48,0.12); border-color: rgba(255,110,110,0.5); color: #ff8f85; }
.dbg-export {
  position: absolute; inset: 8%; background: #0b1224; border: 2px solid var(--yellow);
  display: none; flex-direction: column; z-index: 5;
}
.dbg-export-head { display: flex; justify-content: space-between; align-items: center; color: var(--yellow); font-weight: 900; font-style: italic; letter-spacing: 1px; padding: 8px 12px; }
.dbg-export textarea {
  flex: 1; margin: 0 10px 10px; background: #060a14; color: #cde; border: 1px solid #345;
  font-family: 'Courier New', monospace; font-size: 11px; padding: 8px; resize: none;
}

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; display: none; }
#stageinfo {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: 14px;
  color: #fff; font-weight: 700; font-style: italic; letter-spacing: 1px;
  font-size: clamp(11px, 1.8vh, 15px);
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  opacity: 0.9;
}
#timer {
  position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
  color: #fff; font-weight: 900; font-size: clamp(17px, min(3.6vh, 4.5vw), 30px);
  font-family: 'Courier New', monospace; letter-spacing: 1px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
  background: rgba(0,0,0,0.35); padding: 2px 10px; border-left: 4px solid var(--yellow);
}
#progressbar {
  position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.4);
}
#progressfill { height: 100%; width: 0%; background: var(--yellow); }
#pacenote {
  position: absolute; top: max(44px, calc(env(safe-area-inset-top) + 34px)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,0.5); border-radius: 10px; padding: 6px 18px 6px 10px;
  color: #fff; transition: opacity 0.15s; opacity: 0;
}
#pacenote .note-text { font-style: italic; font-weight: 900; font-size: clamp(18px, 3.4vh, 30px); letter-spacing: 1px; }
#pacenote .note-dist { color: var(--yellow); font-weight: 700; font-size: clamp(13px, 2.2vh, 18px); font-family: 'Courier New', monospace; }
#pacenote-next {
  position: absolute; top: max(112px, calc(env(safe-area-inset-top) + 104px)); left: 50%; transform: translateX(-50%) scale(0.8);
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,0.35); border-radius: 8px; padding: 4px 14px 4px 8px;
  color: #fff; transition: opacity 0.15s; opacity: 0;
}
#pacenote-next .note-text { font-style: italic; font-weight: 900; font-size: clamp(14px, 2.4vh, 20px); }
#pacenote-next .note-into { color: var(--yellow); font-weight: 900; font-size: clamp(11px, 1.8vh, 14px); letter-spacing: 1px; }
.note-icon { display: flex; }
#speedbox {
  position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); right: 16px;
  text-align: right; color: #fff;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
}
#speed { font-weight: 900; font-style: italic; font-size: clamp(34px, 6.4vh, 54px); line-height: 0.95; }
#speedunit { font-size: clamp(10px, 1.6vh, 13px); font-weight: 700; letter-spacing: 2px; color: #b8c4dc; }
#gear {
  display: inline-block; margin-right: 8px; color: var(--yellow); font-weight: 900;
  font-size: clamp(24px, 4.4vh, 38px); font-style: italic;
}
#damagebox {
  position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 16px;
  width: clamp(90px, 16vw, 140px);
}
#damagelabel { color: #b8c4dc; font-size: clamp(9px, 1.4vh, 11px); font-weight: 700; letter-spacing: 2px; text-shadow: 1px 1px 1px #000; }
#damagebar { height: 7px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); margin-top: 3px; }
#damagefill { height: 100%; width: 0%; background: #6d4; }
#split {
  position: absolute; top: 34%; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  opacity: 0; transition: opacity 0.25s;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}
#split .split-label { color: #fff; font-weight: 700; letter-spacing: 3px; font-size: clamp(11px, 1.8vh, 14px); }
#split .split-diff { font-weight: 900; font-style: italic; font-family: 'Courier New', monospace; font-size: clamp(26px, 4.6vh, 40px); }
#split .split-diff.good { color: #58e458; }
#split .split-diff.bad { color: #ff5b5b; }
#toast {
  position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
  color: var(--yellow); font-weight: 900; font-style: italic; letter-spacing: 2px;
  font-size: clamp(16px, 2.8vh, 24px); text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
  opacity: 0; transition: opacity 0.3s; white-space: nowrap;
}
.bigmsg {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  font-style: italic; font-weight: 900; color: #fff; pointer-events: none;
  text-shadow: 4px 4px 0 rgba(0,0,0,0.6);
}
.bigmsg.count { font-size: clamp(90px, 22vh, 180px); color: var(--yellow); }
.bigmsg.go { font-size: clamp(80px, 20vh, 160px); color: #58e458; }
.bigmsg.finish { font-size: clamp(48px, 12vh, 110px); color: var(--yellow); letter-spacing: 4px; }

/* ---------- touch controls ---------- */
#touch { position: absolute; inset: 0; display: none; }
.tbtn {
  position: absolute; pointer-events: auto;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.35);
  border-radius: 14px; color: rgba(255,255,255,0.9);
  font-weight: 900; font-style: italic; font-size: 20px; letter-spacing: 1px;
  touch-action: none;
}
.tbtn.on { background: rgba(255,204,0,0.45); border-color: var(--yellow); }
.tbtn svg { pointer-events: none; }
#t-left  { left: max(12px, env(safe-area-inset-left)); bottom: max(70px, calc(env(safe-area-inset-bottom) + 12px)); width: 19vw; max-width: 120px; height: 16vh; min-height: 84px; }
#t-right { left: calc(max(12px, env(safe-area-inset-left)) + min(19vw, 120px) + 10px); bottom: max(70px, calc(env(safe-area-inset-bottom) + 12px)); width: 19vw; max-width: 120px; height: 16vh; min-height: 84px; }
#t-gas   { right: max(12px, env(safe-area-inset-right)); bottom: max(154px, calc(env(safe-area-inset-bottom) + 96px)); width: 21vw; max-width: 130px; height: 15vh; min-height: 80px; background: rgba(70,200,90,0.18); border-color: rgba(120,230,140,0.5); }
#t-brake { right: max(12px, env(safe-area-inset-right)); bottom: max(70px, calc(env(safe-area-inset-bottom) + 12px)); width: 21vw; max-width: 130px; height: 9vh; min-height: 56px; background: rgba(230,70,70,0.18); border-color: rgba(255,120,120,0.5); }
#t-hand  { right: calc(max(12px, env(safe-area-inset-right)) + min(21vw, 130px) + 10px); bottom: max(70px, calc(env(safe-area-inset-bottom) + 12px)); width: 15vw; max-width: 92px; height: 11vh; min-height: 64px; font-size: 13px; }
.tbtn.small {
  width: 44px; height: 40px; border-radius: 9px; font-size: 13px; font-style: normal; font-weight: 700;
  background: rgba(0,0,0,0.4);
}
#t-pause { top: max(46px, calc(env(safe-area-inset-top) + 36px)); right: 12px; }
#t-reset { top: max(46px, calc(env(safe-area-inset-top) + 36px)); right: 64px; }
#t-cam   { top: max(46px, calc(env(safe-area-inset-top) + 36px)); right: 116px; }

/* ---------- loading ---------- */
#loading {
  position: absolute; inset: 0; display: none; flex-direction: column; gap: 18px;
  align-items: center; justify-content: center;
  background: linear-gradient(115deg, #060a14 0%, #0c1f46 50%, #060a14 100%);
  color: #fff; pointer-events: auto;
}
.load-text { font-style: italic; font-weight: 900; letter-spacing: 2px; font-size: clamp(15px, 2.6vh, 24px); text-align: center; padding: 0 20px; }
.load-bar { width: min(320px, 70vw); height: 6px; background: rgba(255,255,255,0.12); overflow: hidden; }
.load-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--yellow); animation: slide 0.9s linear infinite; }
@keyframes slide { from { transform: translateX(-100%);} to { transform: translateX(350%);} }
.load-hint { color: #8fa0be; font-size: clamp(10px, 1.6vh, 13px); letter-spacing: 1px; }

/* ---------- rallycross HUD ---------- */
#posbox {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: 14px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
}
#pos { color: var(--yellow); font-weight: 900; font-style: italic; font-size: clamp(30px, 6vh, 52px); line-height: 0.95; }
#lap { color: #fff; font-weight: 900; font-style: italic; font-size: clamp(14px, 2.4vh, 20px); letter-spacing: 1px; }
#lapbox {
  position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + clamp(34px, 5.4vh, 44px)); right: 16px;
  text-align: right; color: #cdd6e6; font-family: 'Courier New', monospace; font-weight: 700;
  font-size: clamp(11px, 1.8vh, 15px); text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}
#minimap {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: clamp(84px, 15vh, 130px); height: clamp(84px, 15vh, 130px);
  opacity: 0.92;
}
#stageinfo { top: auto !important; bottom: max(14px, env(safe-area-inset-bottom)); left: 50% !important; transform: translateX(-50%); }
/* keep the touch quick-buttons clear of the lap/best times readout */
#t-pause, #t-reset, #t-cam { top: calc(max(46px, env(safe-area-inset-top) + 36px) + 64px); }


.m-logo { width: min(92%, 470px); height: auto; display: block; filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.35)); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hud">
    <div id="progressbar"><div id="progressfill"></div></div>
    <div id="stageinfo"></div>
    <div id="posbox">
      <div id="pos">P6</div>
      <div id="lap">LAP 1/4</div>
    </div>
    <div id="timer">00:00.00</div>
    <div id="lapbox">
      <div id="laptime">LAP --:--.-</div>
      <div id="bestlap">BEST --:--.-</div>
    </div>
    <canvas id="minimap" width="220" height="220"></canvas>
    <div id="split"></div>
    <div id="toast"></div>
    <div id="speedbox">
      <div><span id="gear">1</span><span id="speed">0</span></div>
      <div id="speedunit">KM/H</div>
    </div>
    <div id="damagebox">
      <div id="damagelabel">DAMAGE</div>
      <div id="damagebar"><div id="damagefill"></div></div>
    </div>
  </div>
  <div id="bigmsg" class="bigmsg"></div>
  <div id="touch">
    <div class="tbtn" id="t-left"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="tbtn" id="t-right"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="tbtn" id="t-gas">GAS</div>
    <div class="tbtn" id="t-brake">BRAKE</div>
    <div class="tbtn" id="t-hand">E-BRAKE</div>
    <div class="tbtn small" id="t-pause">II</div>
    <div class="tbtn small" id="t-reset">R</div>
    <div class="tbtn small" id="t-cam">C</div>
  </div>
  <div id="menu"></div>
  <div id="debugbtn" title="Tuning panel (` key)">🔧</div>
  <div id="debugpanel"></div>
  <div id="loading">
    <div class="load-text">LOADING STAGE</div>
    <div class="load-bar"></div>
    <div class="load-hint">building road · terrain · pacenotes</div>
  </div>
