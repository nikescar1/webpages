name = "ff-league"
main = "src/index.js"
compatibility_date = "2025-01-15"

# Refresh NFL stats hourly. Ingest is CPU-heavy so it only ever runs here,
# never on a user request.
[triggers]
crons = ["15 * * * *"]

[vars]
# Lock this down to your Pages origin once you know it, e.g.
# ALLOWED_ORIGIN = "https://nikescar1.github.io"
ALLOWED_ORIGIN = "*"

[[durable_objects.bindings]]
name = "LEAGUE"
class_name = "LeagueRoom"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "UserRegistry"

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsCache"

# SQLite-backed Durable Objects are available on the Workers free plan.
# (The older key-value backed classes require a paid plan.)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeagueRoom", "UserRegistry", "StatsCache"]

[observability]
enabled = true
