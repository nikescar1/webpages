// WebGL is optional — the league is fully playable without it.
var ok = (function(){ try { var c=document.createElement('canvas');
  return !!(window.WebGLRenderingContext && (c.getContext('webgl2')||c.getContext('webgl'))); } catch(e){ return false; } })();

window.__Ceremony__ = ok ? Ceremony : function(){ return { start:function(){}, stop:function(){} }; };
window.__pickBurst = pickBurst;
window.__hero__ = {
  inst: null,
  start: function(){
    if (!ok) return;
    var c = document.getElementById('gate-canvas');
    if (!c) return;
    if (this.inst && this.inst.canvas !== c) { this.inst.stop(); this.inst = null; }
    if (!this.inst) this.inst = new HeroField(c);
    try { this.inst.start(); } catch(e) { /* driver refused a context — no background */ }
  },
  stop: function(){ if (this.inst) this.inst.stop(); }
};
})();
</script>
